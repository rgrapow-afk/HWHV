<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161f">
<title>호드워 천국 길드</title>
<style>
:root{--bg:#14161f;--card:#1e2130;--card2:#272b3f;--tx:#eceef6;--sub:#9aa0b8;--ac:#7c9cff;--up:#4ade80;--down:#f87171;--warn:#fbbf24;--bd:#333852}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Noto Sans KR",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--bd)}
h1{margin:0;font-size:18px}
.sub{color:var(--sub);font-size:13px}
main{padding:12px 14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--sub);padding:10px 2px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--ac)}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:11px 12px;margin-bottom:6px}
.row.g0{background:#2e365c}
.row .no{width:30px;text-align:center;font-weight:700;color:var(--ac);flex:none}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--sub);margin-left:4px}
.badge.w{background:#4a3b12;color:var(--warn)}
.up{color:var(--up)}.down{color:var(--down)}
button.btn{background:var(--ac);color:#0b0e1a;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700}
button.btn.sec{background:var(--card2);color:var(--tx)}
button.btn.dg{background:#5b2227;color:#fecaca}
button.btn.sm{padding:6px 10px;font-size:13px}
input,select{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:16px;width:100%}
input[type=checkbox]{width:auto}
.tog{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-radius:10px;margin-bottom:10px}
.tog input{width:22px;height:22px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bar>*{flex:1 1 40%}
.warnbox{background:#4a2b12;color:#fde68a;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.party h3{margin:0 0 6px;font-size:15px;color:var(--ac)}
.party div.m{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--bd)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:100%;height:100%;margin:0}
.chips span{display:block;min-width:38px;text-align:center;padding:7px 0;border-radius:8px;background:var(--card2);color:var(--sub);font-weight:700;border:1px solid var(--bd)}
.chips input:checked+span{background:var(--ac);color:#0b0e1a;border-color:var(--ac)}
.legend div{font-size:13px;padding:2px 0}
.aatool{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.aatool .btn{padding:8px 7px;font-size:13px;white-space:nowrap;flex:0 0 auto}
.aatool select{width:auto;padding:7px 4px;font-size:13px}
.aaboard{display:flex;flex-direction:column;gap:10px;min-height:0}
.pane{overflow-y:auto;border-radius:12px;background:#3a4268;padding:14px 4px 10px;-webkit-overflow-scrolling:touch}
.pane.p1{flex:69 1 0}.pane.p2{flex:31 1 0}
/* 칸 크기(적 수비 = 점선 칸)는 --bw x --bh 로 통일. JS(fitBoard)가 화면 폭에 맞춰 최대 81x75(=기존 54x50의 1.5배)로 계산 */
.aaboard{--bw:81px;--bh:75px;--rbw:81px;--gg:28px}
.brow{display:flex;justify-content:center;gap:var(--gg);margin-bottom:30px}
.bitem{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;width:calc(var(--bw)*2 + 3px)}
.bpair{display:flex;gap:3px}
.bl{display:flex;align-items:center;justify-content:center;height:22px;flex:none;background:var(--card2);color:var(--ac);border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap;padding:0 4px}
.bl .cnt{font-size:10px;font-weight:400;color:var(--sub);margin-left:5px}
.be{flex:0 0 var(--bw);width:var(--bw);height:var(--bh);background:var(--card2);color:var(--tx);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;padding:2px;cursor:pointer}
.be .s{font-size:10px;color:var(--sub);max-width:100%;overflow:hidden}
.be .s.nm{font-size:var(--nfs,14px);line-height:1.12;color:#9ea5bd;font-weight:600;text-align:center;word-break:keep-all;letter-spacing:-.4px}.be .v{font-size:14px;font-weight:700}
.bd{flex:0 0 var(--bw);width:var(--bw);height:var(--bh);border:1.5px dashed #aeb7e0;border-radius:8px;display:flex;align-items:stretch;justify-content:center;padding:0;overflow:hidden}
.bd.hot{background:#4f5b94;border-color:#fff}
.pane .sub,.pane .psub{color:#d5dbf2}
.rrow{display:flex;flex-direction:column;gap:5px;margin-bottom:30px}
.rrow .bl{align-self:flex-start;min-width:90px}
.rgrid{display:grid;grid-template-columns:repeat(5,var(--rbw));gap:12px 8px;align-content:start;justify-content:center}
.rgrid .bd.cell{flex:none;width:var(--rbw);height:var(--bh)}
.rrow .bd.cmd{align-self:flex-start;margin:0 auto;flex:none;width:var(--rbw);height:var(--bh)}
.rsep{height:4px}
.aaboard.tight .mchip .cp{font-size:11px}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px 6px}
.pgrid .mchip{height:54px}
.psub{font-size:12px;color:var(--sub);margin-bottom:8px}
.mchip{width:100%;height:100%;background:var(--card2);color:var(--tx);border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:2px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;border:1.5px solid #3a4060;overflow:hidden}
.mchip .cn{font-size:var(--nfs,14px);line-height:1.12;max-width:100%;overflow:hidden;word-break:keep-all;color:#fff;font-weight:700;text-align:center;letter-spacing:-.4px}
.mchip .cp{font-size:12px;font-weight:700;color:#3dfcff;margin-top:1px}
.rgrid .mchip .cn{font-size:var(--rfs,13px)}
.pgrid .mchip .cn{font-size:var(--pfs,13px)}
.bd:not(.cell) .mchip .cp{font-size:13px}
.mchip.sel{border-color:var(--ac);box-shadow:0 0 0 2px #7c9cff55}
.mchip.dragging{opacity:.35}
.mchip.st-ok{border-color:var(--up)}.mchip.st-mid{border-color:var(--warn)}.mchip.st-low{border-color:var(--down)}
.mchip.ghost{position:fixed;max-height:80px;z-index:60;pointer-events:none;opacity:.95;box-shadow:0 6px 18px #000a;transform:scale(1.08)}
.altgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;align-items:start}
.altR{position:sticky;top:62px;max-height:calc(100vh - 150px);overflow-y:auto}
.acard{background:var(--card);border-radius:10px;padding:7px 8px;margin-bottom:6px}
.ah{display:flex;align-items:center;gap:6px}
.ah .no{width:20px;text-align:center;font-weight:700;color:var(--ac);font-size:13px;flex:none}
.ah .an{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.ah .ap{font-size:12px;color:var(--sub);flex:none}
.acard .chips{gap:4px;margin-top:5px}
.acard .chips span{min-width:0;padding:5px 7px;font-size:12px;border-radius:7px}
.acard .chips.sub span{padding:4px 8px;background:#262a3f}
.acard .chips.sub input:checked+span{background:var(--ac);color:#0b0e1a;border-color:var(--ac)}
.altR .bar button{flex:1 1 100%;white-space:nowrap;padding:7px 4px;font-size:13px}
.erow{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:8px;padding:9px 8px;margin-bottom:5px;font-size:14px}
.erow b{width:62px;flex:none;color:var(--ac);font-size:13px}
.erow .en{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub);font-size:12px}
.erow .ep{font-weight:700;flex:none}
.legend b{color:var(--ac);display:inline-block;width:18px}
.drow{display:grid;grid-template-columns:1.4fr 1fr .7fr 1fr 34px;gap:5px;margin-bottom:6px}
.drow.warn input{border-color:var(--warn)}
.drow input,.drow select{padding:8px 6px;font-size:14px}
.drow button{background:#5b2227;color:#fecaca;border:0;border-radius:8px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet label{display:block;margin:10px 0 4px;font-size:13px;color:var(--sub)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd);font-size:14px}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
</style>
</head>
<body>
<header><h1>🏰 호드워 · 천국 길드</h1><div class="sub" id="hsub"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheet"></div>

<script>
const KEY='hodwar-heaven-v1';
const ALT=[
 ['공-요','[최우선공격조]','불안탄 요새'],['공-성','[최우선공격조]','불안탄 주성'],
 ['공-둔','[공격조1]','주둔지'],['비-성','[비상대기조]','주성'],
 ['비-둔','[비상대기조]','주둔지'],['막','[막타조]','막타']];
const SUBS=['1-6','7-13','14-17'];
const MIG={A:'공-요',B:'공-성',C:'공-둔',D:'공-둔',E:'비-성',F:'비-둔',G:'막'};
const ROLE_WORDS=['부길드마스터','길드마스터','부길드장','길드장','부마스터','마스터','장로','간부','정예','길드원','멤버'];
const TABS=[['rank','🏆','순위'],['change','📈','성장'],['party','⚔️','파티'],['alt','🛡️','알터랙'],['input','📷','입력']];

let S=load(); let tab='rank'; let draft=[];
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.members){s.members.forEach(m=>{if(m.alt)m.alt=[...new Set(m.alt.map(x=>MIG[x]||x))]});return s}}catch(e){}return{members:[],filters:{rank:false,change:false,party:false}}}
let STORE_OK=true,SAVED_AT='';
function probeStore(){try{localStorage.setItem(KEY+'-probe','1');const ok=localStorage.getItem(KEY+'-probe')==='1';localStorage.removeItem(KEY+'-probe');return ok}catch(e){return false}}
function save(){
  try{const j=JSON.stringify(S);localStorage.setItem(KEY,j);if(localStorage.getItem(KEY)!==j)throw new Error('verify');STORE_OK=true;SAVED_AT=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
  catch(e){STORE_OK=false;alert('⚠ 이 브라우저에서는 데이터가 저장되지 않습니다.\n웹 주소(https)로 접속했는지 확인하고, 임시로 [입력] 탭의 백업(파일)을 사용하세요.')}
}
STORE_OK=probeStore();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const raw=(v,u)=>Math.round(parseFloat(v)*(u==='B'?1e9:1e6));
function fmt(n){return n>=1e9?(+(n/1e9).toFixed(3))+'B':(+(n/1e6).toFixed(2))+'M'}
const dates=m=>Object.keys(m.history).sort();
const latest=m=>{const d=dates(m);return d.length?m.history[d[d.length-1]]:0};
const latestDate=m=>{const d=dates(m);return d[d.length-1]||''};
const find=n=>S.members.find(m=>m.name===n);
/* 순위 페이지용: 길드장 → 부길드장 → 장로 → 멤버 순, 각 직책 안에서는 전투력 순 */
const RANK_ORDER=['길드장','부길드장','장로'];
const roleRank=m=>{const i=RANK_ORDER.indexOf(m.role);return i<0?RANK_ORDER.length:i};
function rankPool(include){if(S.rankPower)return pool(include);return pool(include).sort((a,b)=>roleRank(a)-roleRank(b)||latest(b)-latest(a))}
function pool(include){return S.members.filter(m=>(include||m.guild)&&dates(m).length).sort((a,b)=>latest(b)-latest(a))}
function toggle(key){return `<label class="tog"><input type="checkbox" data-filter="${key}" ${S.filters[key]?'checked':''}> 길드 외(가입대기 등) 포함</label>`}
const badges=m=>(m.role&&m.role!=='멤버'?`<span class="badge">${esc(m.role)}</span>`:'')+(m.guild?'':'<span class="badge w">대기</span>');

function render(){
  $('nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-tab="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
  const g=S.members.filter(m=>m.guild).length;
  const all=S.members.flatMap(dates).sort().pop();
  $('hsub').textContent=`길드원 ${g}명 · 최근 기록 ${all||'없음'} · `+(STORE_OK?(SAVED_AT?'💾 저장됨 '+SAVED_AT:'💾 자동저장 켜짐'):'⚠ 저장 불가');
  ({rank:vRank,change:vChange,party:vParty,alt:vAlt,input:vInput})[tab]();
  if(!STORE_OK)$('main').insertAdjacentHTML('afterbegin','<div class="warnbox">⚠ 이 화면에서는 <b>데이터가 저장되지 않습니다</b>. 파일을 직접 열었거나(file:// , 앱 미리보기, 시크릿 모드) 저장이 막힌 상태예요. 크롬에서 <b>웹 주소(https)</b>로 접속하세요. 그 전에는 [입력] 탭의 <b>백업(파일)</b>으로 데이터를 보관하세요.</div>');
}

let qaOpen=false;
function vRank(){
  const l=rankPool(S.filters.rank);
  const bs='style="flex:1 1 0;padding:10px 2px;font-size:12.5px;white-space:nowrap"';
  const qa=qaOpen?`<div class="card"><b>＋ 대기자 빠른 추가</b> <span class="sub">(이름·전투력 입력 후 Enter)</span>
  <input id="qa_name" placeholder="이름" autocomplete="off" style="margin-top:8px">
  <div class="two" style="margin-top:6px"><input id="qa_val" inputmode="decimal" placeholder="전투력 (예: 250.5)"><select id="qa_unit"><option${(S.qunit||'M')==='B'?' selected':''}>B</option><option${(S.qunit||'M')==='M'?' selected':''}>M</option></select></div>
  <label class="tog" style="margin:8px 0 0"><input type="checkbox" id="qa_guild"> 길드원으로 추가 (체크 안 하면 대기자)</label>
  <div class="bar" style="margin:8px 0 0"><button class="btn sec" data-act="qatoggle">접기</button><button class="btn" data-act="qadd">추가</button></div></div>`:'';
  $('main').innerHTML=toggle('rank')+`<div class="bar" style="flex-wrap:nowrap;gap:6px"><button class="btn ${qaOpen?'':'sec'}" ${bs} data-act="qatoggle">＋ 대기자 ${qaOpen?'▴':'▾'}</button><button class="btn sec" ${bs} data-act="roles">👑 직책</button><button class="btn sec" ${bs} data-act="img" data-k="rank">🖼 이미지</button><button class="btn sec" ${bs} data-act="tbl" data-k="rank">📊 엑셀</button><button class="btn ${S.rankPower?'':'sec'}" ${bs} data-act="rankpow">⚡ 전투력</button></div>`+qa+
  (l.length?l.map((m,i)=>`<div class="row g${Math.floor(i/5)%2}" data-edit="${esc(m.name)}"><div class="no">${i+1}</div><div class="nm"><b>${esc(m.name)}${badges(m)}</b><span class="sub">${latestDate(m)} · ✏️ 눌러서 수정</span></div><div class="val"><b>${fmt(latest(m))}</b></div></div>`).join(''):'<div class="empty">데이터가 없습니다.<br>[입력] 탭에서 캡처를 올려주세요.</div>');
}

const CMODES=[['prev','직전',0],['week','주간',7],['month','월간',30]];
const dayDiff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
/* 모두 같은 두 날짜로 비교: 기준일에 기록이 없는 멤버(그 뒤에 충원된 멤버)는 비교에서 제외 */
function changeRef(){
  const mode=S.cmode||'prev',cm=CMODES.find(x=>x[0]===mode),need=mode==='week'?4:mode==='month'?15:1;
  const all=[...new Set(S.members.flatMap(dates))].sort(),d1=all[all.length-1];
  if(all.length<2)return{d0:null,d1};
  const prior=all.slice(0,-1);
  if(mode==='prev')return{d0:prior[prior.length-1],d1};
  let d0=null,bd=1e9;
  for(const x of prior){const gap=dayDiff(d1,x);if(gap<need)continue;const diff=Math.abs(gap-cm[2]);if(diff<bd){bd=diff;d0=x}}
  return{d0,d1};
}
function changes(include){
  const sortBy=S.csort||'power',{d0,d1}=changeRef();
  const rows=pool(include).map(m=>{
    const dl=latestDate(m),b=m.history[dl],a=(d0&&dl===d1&&d0 in m.history)?m.history[d0]:null;
    return{m,b,a,d0:a?d0:null,d1:dl,diff:a?b-a:null,pct:a?(b-a)/a*100:null,fresh:!a&&!!d0&&dates(m)[0]>d0}});
  rows.forEach((r,i)=>r.pr=i+1);
  const key=(S.cmetric||'pct')==='abs'?'diff':'pct';
  const w=rows.filter(r=>r.pct!==null).sort((x,y)=>y[key]-x[key]);w.forEach((r,i)=>r.rr=i+1);
  return sortBy==='rate'?[...w,...rows.filter(r=>r.pct===null)]:rows;
}
const cMetric=()=>S.cmetric||'pct',mLabel=()=>cMetric()==='abs'?'성장 전투력':'성장률';
const sdiff=d=>(d>=0?'+':'-')+fmt(Math.abs(d)),spct=p=>(p>=0?'+':'')+p.toFixed(2)+'%';
const cMain=c=>c.pct===null?'-':cMetric()==='abs'?sdiff(c.diff):spct(c.pct);
const cSecond=c=>c.pct===null?'':cMetric()==='abs'?spct(c.pct):sdiff(c.diff);
const cLabel=()=>CMODES.find(x=>x[0]===(S.cmode||'prev'))[1];
function vChange(){
  const inc=S.filters.change,l=changes(inc),rate=(S.csort||'power')==='rate',mode=S.cmode||'prev';
  const ctl=`<div class="bar" style="flex-wrap:nowrap">${CMODES.map(c=>`<button class="btn ${c[0]===mode?'':'sec'}" style="flex:1 1 0;padding:11px 4px" data-cmode="${c[0]}">${c[1]}</button>`).join('')}</div>
  <div class="bar">${[['pct','성장률(%)'],['abs','성장 전투력']].map(c=>`<button class="btn ${c[0]===cMetric()?'':'sec'}" data-cmetric="${c[0]}">${c[1]}</button>`).join('')}</div>
  <div class="bar"><button class="btn ${rate?'':'sec'}" data-act="csort">${rate?`✓ ${mLabel()} 순위순 (눌러서 해제)`:`📈 ${mLabel()} 순위로 보기`}</button></div>`;
  const row=(c,i)=>{const up=c.pct!==null&&c.pct>=0;

const eLabel=k=>k==='C'?'주성':k==='F1'?'요새1':k==='F2'?'요새2':'주둔지'+k.slice(1);

/* --- 적 캡처 인식: 초록색 체력바 위치로 노드를 찾고, 전투력/라벨을 읽음 --- */
function findBars(cv){
  const W=cv.W,H=cv.H,px=cv.px,runs=[];
  for(let y=0;y<H;y++){
    let s=-1,last=-99;
    for(let x=0;x<W;x++){const i=(y*W+x)*4,r=px[i],g=px[i+1],b=px[i+2];
      if(g>140&&g-b>80&&g>=r-10&&r<215){if(s<0)s=x;last=x}
      else if(s>=0&&x-last>45){if(last-s+1>=150)runs.push([y,s,last]);s=-1}}
    if(s>=0&&last-s+1>=150)runs.push([y,s,last]);
  }
  const groups=[];
  for(const r of runs){const g=groups.find(g=>Math.abs(g.y1-r[0])<=2&&Math.abs(g.x0-r[1])<30&&Math.abs(g.x1-r[2])<30);
    if(g){g.y1=r[0];g.n++}else groups.push({y0:r[0],y1:r[0],x0:r[1],x1:r[2],n:1})}
  return groups.filter(g=>g.n>=5);
}
function parseEP(t){
  let c=(t||'').replace(/[^0-9.BM]/g,'');
  if(!c.includes('.')){const D=c.replace(/[BM]/g,''),L=D.length;
    if(L===4&&/[68]$/.test(D))c=D[0]+'.'+D.slice(1,3)+'B';
    else if(L===3&&/B/.test(c))c=D[0]+'.'+D.slice(1)+'B';
    else if(L===5&&/8$/.test(D))c=D.slice(0,2)+'.'+D.slice(2,4)+'B';
    else if(L===5||L===6)c=D.slice(0,3)+'.'+D.slice(3,5)+'M';
    else return null}
  const m=c.match(/^(\d{1,3})\.(\d{1,2})(.*)$/);if(!m)return null;
  const tail=m[3];let unit;
  if(tail.includes('B')||tail[0]==='8')unit='B';else if(tail)unit='M';else unit=m[1].length===1?'B':'M';
  return{val:m[1]+'.'+m[2],unit};
}
async function readEnemyPower(cv,b,W){
  const votes={};
  for(const off of [32,28,36,40]){
    const p=parseEP((await W.p.recognize(crop(cv,b.x0+off,b.y0-56,b.x1-b.x0-off+22,46,3))).data.text);
    if(p){const k=p.val+p.unit;(votes[k]=votes[k]||{p,n:0}).n++;if(votes[k].n>=3)break}}
  const top=Object.values(votes).sort((a,c)=>c.n-a.n)[0];
  return top?{val:top.p.val,unit:top.p.unit,n:top.n}:null;
}
/* 이름: 전투력 바로 위의 주황색 글씨. 밝기/주황색 두 방식으로 흑백 변환해서 읽고 한글이 더 많이 읽힌 쪽을 사용 */
function nameCanvas(cv,l,t,w,h,mode,sc){
  const c=document.createElement('canvas');c.width=w+16;c.height=h+16;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  const im=x.getImageData(8,8,w,h),d=im.data;
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
    const px=l+xx,py=t+yy;let v=255;
    if(px>=0&&py>=0&&px<cv.W&&py<cv.H){const i=(py*cv.W+px)*4,r=cv.px[i],g=cv.px[i+1],b=cv.px[i+2];
      const on=mode==='lum'?(r*.3+g*.59+b*.11)>150:(r>150&&r-b>60);v=on?0:255}
    const o=(yy*w+xx)*4;d[o]=d[o+1]=d[o+2]=v;d[o+3]=255}
  x.putImageData(im,8,8);
  const o2=document.createElement('canvas');o2.width=c.width*sc;o2.height=c.height*sc;
  const x2=o2.getContext('2d');x2.imageSmoothingQuality='high';x2.drawImage(c,0,0,o2.width,o2.height);return o2;
}
async function readEnemyName(cv,b,W){
  const w=b.x1-b.x0+30,l=b.x0-6;let best='';
  for(const [mode,dy0,dy1] of [['lum',-86,-48],['warm',-84,-52]]){
    const txt=(await W.k.recognize(nameCanvas(cv,l,b.y0+dy0,w,dy1-dy0,mode,3))).data.text;
    const tok=txt.split(/\s+/).map(t=>t.replace(/[^가-힣A-Za-z0-9]/g,'')).filter(Boolean).sort((a,c)=>hangul(c)-hangul(a)||c.length-a.length)[0]||'';
    if(hangul(tok)>=2&&hangul(tok)>hangul(best))best=tok;
  }
  return best;
}
async function readEnemyLabel(cv,b,W){
  const texts=[];
  for(const [dx0,dx1,dy0,dy1,s] of [[-70,135,40,92,3],[-60,125,44,88,4],[-80,150,36,96,3]])
    texts.push((await W.k.recognize(crop(cv,Math.max(0,b.x0+dx0),b.y0+dy0,dx1-dx0,dy1-dy0,s))).data.text);
  const all=texts.join(' ');
  if(/주둔|일반|둔지|듄지/.test(all)||/[지시]\s*\d/.test(all)){
    const votes={};
    texts.forEach(t=>{const m=t.match(/[지시]\s*(\d{1,3})/);if(m){let d=m[1];if(+d>17)d=d.slice(0,2);if(+d>17)d=d[0];if(+d>=1&&+d<=17)votes[d]=(votes[d]||0)+1}});
    const top=Object.entries(votes).sort((a,c)=>c[1]-a[1])[0];
    return{type:'G',n:top?+top[0]:0};
  }
  if(/요|새/.test(all))return{type:'F'};
  if(/성/.test(all))return{type:'C'};
  return{type:''};
}
async function runEnemyOcr(files){
  const st=$('est'),W={};
  const say=t=>{if($('est'))$('est').textContent=t};
  try{
    say('OCR 엔진 로딩 중…(처음에는 오래 걸립니다)');await loadTess();
    W.p=await Tesseract.createWorker('eng');await W.p.setParameters({tessedit_char_whitelist:'0123456789.BM',tessedit_pageseg_mode:'7'});
    W.k=await Tesseract.createWorker('kor+eng');await W.k.setParameters({tessedit_pageseg_mode:'7'});
    const nodes=[];
    for(let i=0;i<files.length;i++){
      const cv=norm(await loadImg(files[i]),1080);
      const bars=findBars(cv).sort((a,b)=>a.y0-b.y0||a.x0-b.x0),found=[];
      for(const b of bars){
        say(`이미지 ${i+1}/${files.length} · 노드 ${found.length+1}/${bars.length} 분석 중…`);
        found.push({b,p:await readEnemyPower(cv,b,W),lb:await readEnemyLabel(cv,b,W),nm:await readEnemyName(cv,b,W)});
      }
      const F=found.filter(x=>x.lb.type==='F').sort((a,c)=>a.b.x0-c.b.x0);
      F.forEach((x,idx)=>{x.slot=F.length===2?(idx===0?'F2':'F1'):((x.b.x0+x.b.x1)/2<cv.W/2?'F2':'F1')});
      found.forEach(x=>{if(x.lb.type==='C')x.slot='C';else if(x.lb.type==='G'&&x.lb.n)x.slot='G'+x.lb.n});
      if(found.length&&!found.some(x=>x.slot==='C')){const c0=found[0];if(!c0.slot&&!c0.lb.type&&Math.abs((c0.b.x0+c0.b.x1)/2-cv.W*0.59)<200)c0.slot='C'}
      found.forEach(x=>nodes.push({slot:x.slot||'',val:x.p?x.p.val+x.p.unit:'',n:x.p?x.p.n:0,name:x.nm||''}));
    }
    const out=[],seen={};
    nodes.forEach(n=>{if(n.slot&&seen[n.slot]){if(n.n>seen[n.slot].n)Object.assign(seen[n.slot],n)}else{const c={...n};out.push(c);if(n.slot)seen[n.slot]=c}});
    out.sort((a,c)=>(ECODES.indexOf(a.slot)+99*(a.slot?0:1))-(ECODES.indexOf(c.slot)+99*(c.slot?0:1)));
    say(`${out.length}개 노드 인식`);
    if(!out.length)return alert('적 노드를 찾지 못했습니다. 알터랙 전투 지도 화면 캡처인지 확인하세요.');
    showEnemyResult(out);
  }catch(e){say('오류: '+e.message);console.error(e)}
  finally{for(const w of Object.values(W))w.terminate()}
}
function showEnemyResult(nodes){
  const opts=sel=>'<option value="">(제외/미지정)</option>'+ECODES.map(k=>`<option value="${k}"${k===sel?' selected':''}>${eLabel(k)}</option>`).join('');
  $('sheet').innerHTML=`<div class="sheet"><div><h3 style="margin:0 0 4px">적 인식 결과 (${nodes.length}개)</h3>
  <div class="sub">자리(주성/요새/주둔지)와 전투력을 확인·수정한 뒤 저장하세요. 가려져 인식되지 않은 자리는 건드리지 않고 그대로 둡니다.</div>

/* ---------- OCR ---------- */
async function loadTess(){if(window.Tesseract)return;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>no(new Error('OCR 라이브러리 로딩 실패 (인터넷 연결 확인)'));document.head.appendChild(s)})}
/* ===== 길드 '멤버 정보' 화면 인식 (가로 720px 기준으로 정규화, 카드 124px 간격) ===== */
const LAY={top:372,bot:1272,pitch:124,nameY:39,powY:76,ratio:1560/720};
const POW_VARIANTS=[[220,4],[222,4],[224,4],[220,3],[222,5],[226,4]];
function loadImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>no(new Error('이미지를 열 수 없습니다'));i.src=u})}
function norm(img,w=720){const h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);
  return{c,W:w,H:h,px:x.getImageData(0,0,w,h).data,ratio:img.height/img.width}}
function crop(cv,l,t,w,h,s){
  const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
  const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';
  x.drawImage(cv.c,l,t,w,h,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data,n=c.width*c.height,hist=new Array(256).fill(0);
  for(let i=0;i<n;i++)hist[p[i*4+1]]++;
  let lo=0,hi=255,a=0;for(;lo<255&&(a+=hist[lo])<n*.01;lo++);a=0;for(;hi>0&&(a+=hist[hi])<n*.01;hi--);
  const r=Math.max(1,hi-lo);
  for(let i=0;i<n;i++){const g=Math.max(0,Math.min(255,(p[i*4+1]-lo)*255/r));p[i*4]=p[i*4+1]=p[i*4+2]=g}
  x.putImageData(d,0,0);return c;
}
/* 카드 윗 테두리(가장 어두운 가로선)의 위치로 카드 간격 위상을 찾음 */
function findPhase(cv){
  const rows=[],P=LAY.pitch;
  for(let y=LAY.top;y<Math.min(cv.H,LAY.bot);y++){let s=0,n=0;for(let x=200;x<640;x+=4,n++)s+=cv.px[(y*cv.W+x)*4+1];rows.push([s/n,y])}
  rows.sort((a,b)=>a[0]-b[0]);
  const ph=rows.slice(0,8).map(r=>r[1]%P);let bp=0,best=[];
  for(const q of ph){const g=ph.filter(z=>Math.abs(z-q)<3||Math.abs(z-q)>P-3);if(g.length>best.length){best=g;bp=q}}
  return bp;
}
const cleanName=t=>(t||'').replace(/[^가-힣A-Za-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const hangul=s=>(s.match(/[가-힣]/g)||[]).length;
const rawOf=r=>raw(r.val,r.unit);
const absLn=(a,b)=>Math.abs(Math.log(a/b));
/* 전투력: 여러 방식으로 읽어서 형식(숫자 + B 또는 M)에 맞는 값 중 다수결 */
async function readPower(cv,t,W,deep){
  const votes={},y0=t+LAY.powY-15;
  for(const [l,s] of POW_VARIANTS){
    const r=(await W.p.recognize(crop(cv,l,y0,110,30,s))).data.text.trim();
    if(/^\d{1,3}(\.\d{1,2})?[BM]$/.test(r)){votes[r]=(votes[r]||0)+1;if(votes[r]>=3&&!deep)break}}
  const top=Object.entries(votes).sort((a,b)=>b[1]-a[1])[0];
  if(!top)return null;
  return{val:top[0].slice(0,-1),unit:top[0].slice(-1),n:top[1]};
}
async function readCard(cv,t,W,deep){
  const p=await readPower(cv,t,W,deep);
  let name='',conf=-1;
  for(const s of [3,4,2]){
    const r=await W.n.recognize(crop(cv,158,t+LAY.nameY-17,190,34,s));
    const n=cleanName(r.data.text);if(n&&r.data.confidence>conf){name=n;conf=r.data.confidence}
    if(conf>=88&&!deep)break}
  return{name,val:p?p.val:'',unit:p?p.unit:'B',role:'멤버',warn:!p||p.n<2||conf<70,hasP:!!p};
}
function mergeRows(rows){
  const out=[];
  for(const r of rows){
    const t=r.hasP&&out.find(o=>o.hasP&&o.val===r.val&&o.unit===r.unit);
    if(!t){out.push({...r,names:[{n:r.name,c:r.warn?0:1}]});continue}
    t.names.push({n:r.name,c:r.warn?0:1});t.warn=t.warn&&r.warn;
  }
  return out.map(o=>{
    const cnt={};o.names.filter(x=>x.n).forEach(x=>cnt[x.n]=(cnt[x.n]||0)+1+x.c);
    o.name=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||b.length-a.length)[0]||'';delete o.names;return o});
}
/* 이전 기록과 연결: 전투력 순서를 맞춰 보는 방식 (아바타는 자주 바뀌므로 사용 안 함) */
const nameSim=(a,b)=>{if(!a||!b)return 0;const A=[...a],c=[...b].filter(ch=>A.includes(ch)).length;return c/Math.max(a.length,b.length)};
function matchKnown(rows){
  /* 1차: 읽은 이름이 기존 멤버 이름과 정확히 같으면 먼저 확정 (순위가 뒤바뀌어도 안전) */
  const byName=new Map(S.members.filter(x=>dates(x).length).map(x=>[x.name,x]));
  const groups={};rows.forEach(r=>{if(r.hasP&&byName.has(r.name))(groups[r.name]=groups[r.name]||[]).push(r)});
  const usedR=new Set(),usedM=new Set();let exactCnt=0;
  for(const [nm,rs] of Object.entries(groups)){
    const mm=byName.get(nm),best=rs.slice().sort((a,b)=>absLn(rawOf(a),latest(mm))-absLn(rawOf(b),latest(mm)))[0],l=absLn(rawOf(best),latest(mm));
    if(l<0.5){best.matched=true;best.role=mm.role||best.role;best.warn=l>0.3;usedR.add(best);usedM.add(mm);exactCnt++}
  }
  const nw=rows.map((r,i)=>({r,i})).filter(x=>x.r.hasP&&!usedR.has(x.r));
  const old=S.members.filter(x=>dates(x).length&&!usedM.has(x)).sort((a,b)=>latest(b)-latest(a));
  const n=nw.length,m=old.length;if(!n||!m)return exactCnt;
  const SK=0.6,INF=1e9,D=Array.from({length:n+1},()=>new Array(m+1).fill(INF)),B=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  D[0][0]=0;
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){
    if(i<n&&D[i][j]+SK<D[i+1][j]){D[i+1][j]=D[i][j]+SK;B[i+1][j]=1}
    if(j<m&&D[i][j]+SK<D[i][j+1]){D[i][j+1]=D[i][j]+SK;B[i][j+1]=2}
    if(i<n&&j<m){const l=absLn(rawOf(nw[i].r),latest(old[j]));
      if(l<0.5){const c=D[i][j]+4*l-(nameSim(nw[i].r.name,old[j].name)>=0.5?1.2:0);if(c<D[i+1][j+1]){D[i+1][j+1]=c;B[i+1][j+1]=3}}}
  }
  let i=n,j=m,cnt=exactCnt;
  while(i>0||j>0){const t=B[i][j];
    if(t===3){const r=nw[i-1].r,mm=old[j-1],l=absLn(rawOf(r),latest(mm));
      const same=r.name===mm.name;
      r.name=mm.name;r.matched=true;r.role=mm.role||r.role;
      const near=[nw[i-2],nw[i]].some(x=>x&&absLn(rawOf(x.r),rawOf(r))<Math.max(0.015,2*l));
      r.warn=(same?false:r.warn)||l>0.03||near;cnt++;i--;j--}
    else if(t===1)i--;else j--;}
  return cnt;
}
async function runOcr(opts={}){
  const files=opts.files||[...$('files').files];if(!files.length)return alert('이미지를 선택하세요');
  const deep=!!opts.deep;let result=null;
  const st=$('st');const W={};
  try{
    st.textContent='OCR 엔진 로딩 중…(처음에는 오래 걸립니다)';await loadTess();
    W.p=await Tesseract.createWorker('eng');await W.p.setParameters({tessedit_char_whitelist:'0123456789.BM',tessedit_pageseg_mode:'7'});
    W.n=await Tesseract.createWorker('kor+eng');await W.n.setParameters({tessedit_pageseg_mode:'7'});
    let found=[],warnLayout=0;
    for(let i=0;i<files.length;i++){
      const cv=norm(await loadImg(files[i]));
      if(Math.abs(cv.ratio-LAY.ratio)>.05)warnLayout++;
      const ph=findPhase(cv),P=LAY.pitch;let c=0;
      for(let t=ph-P*4;t<LAY.bot;t+=P){
        if(t<LAY.top-23||t>LAY.bot-92)continue;
        st.textContent=`이미지 ${i+1}/${files.length} · ${++c}번째 카드 분석 중…`;
        found.push(await readCard(cv,t,W,deep));
      }
    }
    const rows=mergeRows(found.filter(r=>r.hasP));
    if(!rows.length){st.textContent='인식된 멤버가 없습니다. 게임의 [멤버 정보] 화면 캡처인지 확인하세요.'+(warnLayout?' (화면 비율이 달라 인식이 어려울 수 있어요)':'');return}
    rows.sort((a,b)=>rawOf(b)-rawOf(a));
    const known=matchKnown(rows);
    rows.forEach(r=>{if(!r.matched&&hangul(r.name)<1)r.warn=true});
    const fresh=rows.filter(r=>!draft.some(d=>d.name&&d.name===r.name));
    draft=[...draft,...fresh];result={rows:fresh};
    st.textContent=(deep?'[재분석] ':'')+`완료: ${rows.length}명 인식 (이전 기록과 자동 매칭 ${known}명). 노란 테두리 = 확인 필요.`+(warnLayout?' ⚠ 화면 비율이 달라 정확도가 낮을 수 있어요.':'');
    renderDraft();
  }catch(e){st.textContent='오류: '+e.message;console.error(e)}
  finally{for(const w of Object.values(W))w.terminate()}
  if(result)verifyCount(result.rows,files,deep);
}

function parseText(text){
  const rows=[];
  for(let line of text.split('\n')){
    line=line.trim();if(line.length<3)continue;
    let val=null,unit='M',rest=line,m=line.match(/(\d[\d,]*(?:\.\d+)?)\s*([BbMm])\b/);
    if(m){val=parseFloat(m[1].replace(/,/g,''));unit=m[2].toUpperCase();rest=line.replace(m[0],' ')}
    else if((m=line.match(/\d{1,3}(?:,\d{3}){2,}|\d{8,}/))){const n=parseFloat(m[0].replace(/,/g,''));if(n>=1e9){val=+(n/1e9).toFixed(3);unit='B'}else{val=+(n/1e6).toFixed(2)}rest=line.replace(m[0],' ')}
    if(val==null||isNaN(val))continue;
    let role='';for(const w of ROLE_WORDS)if(rest.includes(w)){role=w;rest=rest.replace(w,' ');break}
    rest=rest.replace(/Lv\.?\s*\d+/gi,' ').replace(/[^가-힣A-Za-z0-9_ ]/g,' ');
    const tk=rest.split(/\s+/).filter(t=>t.length>=2&&!/^\d+$/.test(t)).sort((a,b)=>b.length-a.length);
    rows.push({name:tk[0]||'',val:String(val),unit,role});
  }
  return rows;
}
/* ---------- 저장 (같은 날짜는 덮어쓰기) + 새 이름 확인 ---------- */
function commit(){
  const date=$('dt').value||today();let u=0;
  draft.forEach(r=>{if(!r.name.trim()&&parseFloat(r.val)>0){while(find('미확인'+(++u)));r.name='미확인'+u}});
  const ok=draft.filter(r=>r.name.trim()&&parseFloat(r.val)>0);
  if(!ok.length)return alert('저장할 항목이 없습니다');
  const unknown=S.members.length?findUnknown(ok):[];
  if(!unknown.length)return doCommit(ok,date);
  startWizard(ok,date,unknown);
}
function doCommit(ok,date){
  const names=new Set();let over=0,added=0,fresh=0;
  ok.forEach(r=>{const n=r.name.trim();names.add(n);let m=find(n);
    if(!m){m={name:n,role:'',guild:true,history:{},alt:[]};S.members.push(m);fresh++}
    if(!m.role)m.role=r.role.trim()||'멤버';
    m.guild=true;const v=raw(r.val,r.unit);
    if(date in m.history){if(m.history[date]!==v)over++}else added++;
    m.history[date]=v});
  if($('demote')&&$('demote').checked)S.members.forEach(m=>{if(m.guild&&!names.has(m.name))m.guild=false});
  save();draft=[];tab='rank';render();
  toast(`${date} 기준 ${ok.length}명 저장`+(fresh?` · 새 멤버 ${fresh}명`:'')+(over?` · 같은 날짜 기록 ${over}건 덮어씀`:''));
}
/* ---------- 인식 인원 확인 / 처음 보는 이름 한 명씩 확인 ---------- */
function verifyCount(rows,files,deep){
  const G=S.members.filter(m=>m.guild).length,N=rows.length;
  if(!G||N===G)return;
  const diff=N-G;
  window.__vc={rows,files,deep};
  $('sheet').innerHTML=`<div class="sheet"><div><h3 style="margin:0 0 6px">인식 인원 확인</h3>
  <div>이번 캡처에서 <b>${N}명</b>이 인식됐어요. <span class="sub">(현재 길드원 ${G}명)</span></div>
  <div style="margin-top:10px;font-size:17px">${diff>0?`추가되는 인원이 <b>${diff}명</b>`:`<b>${-diff}명</b>이 줄어든 것`}이 맞나요?</div>
  <div class="bar" style="margin-top:14px"><button class="btn sec" data-act="vcNo">아니요 (다시 분석)</button><button class="btn" data-act="vcYes">맞아요, 진행</button></div></div></div>`;
}
async function vcNo(){
  const{rows,files,deep}=window.__vc;window.__vc=null;

  if(!deep){await runOcr({files,deep:true});return}
  $('st').textContent='인원이 맞지 않아 분석 결과를 비웠어요. 사진을 확인한 뒤 다시 올려주세요.';

function findUnknown(ok){
  const claimed=new Map();
  ok.forEach(r=>{const n=r.name.trim();if(find(n)){const c=claimed.get(n);if(!c||(!c.matched&&r.matched))claimed.set(n,r)}});
  return ok.filter(r=>{const n=r.name.trim();return !find(n)||claimed.get(n)!==r});
}
function startWizard(ok,date,unknown){

function wzCands(r){
  const w=window.__wz,p=raw(r.val,r.unit),nm=r.name.trim();

    .map(m=>{const sim=nameSim(nm,m.name),ln=absLn(p,latest(m));return{m,sim,ln,score:sim*2-ln*3}}).sort((a,b)=>b.score-a.score);

    <select id="wz_pick" style="margin-top:6px"><option value="">선택…</option>${cands.map(x=>`<option>${esc(x.m.name)}</option>`).join('')}</select>
    <div class="bar" style="margin-top:12px"><button class="btn dg" data-act="wzSkip">이 항목은 저장 안 함</button><button class="btn" data-act="wzPick">선택한 사람으로</button></div>`;
  $('sheet').innerHTML=`<div class="sheet"><div><h3 style="margin:0 0 4px">처음 보는 이름 확인 ${w.i+1}/${w.queue.length}</h3>${body}

}

function saveImage(k){

  const subLines=pg.sub.split('\n').flatMap(wrapSub);

  const top=fixed?122:64+subLines.length*24+10;
  const FIXED_H=122+40*60+PAD,n=pg.items.length;
  const rowH=fixed?Math.max(38,Math.min(60,(FIXED_H-top-PAD)/n)):0;
  const hOf=it=>fixed?rowH:it.head?44:it.text?(it.bold?34:28):(it.s?60:46);
  const H=fixed?Math.max(FIXED_H,top+n*rowH+PAD):Math.max(top+pg.items.reduce((a,it)=>a+hOf(it),0)+PAD,W*2.8);
  const c=document.createElement('canvas');c.width=W*SC;c.height=Math.ceil(H*SC);const x=c.getContext('2d');x.scale(SC,SC);
  x.fillStyle='#14161f';x.fillRect(0,0,W,H);x.textBaseline='middle';x.textAlign='left';
  x.fillStyle='#eceef6';x.font=`bold 26px ${F}`;x.fillText(`천국 길드 · ${pg.name}`,PAD+4,28);
  x.fillStyle='#9aa0b8';x.font=`16px ${F}`;x.fillText(date,PAD+4,54);
  subLines.forEach((t,i)=>{x.fillText(t,PAD+4,78+i*24)});
  let y=top;
  const fit=(txt,font,maxW)=>{let px=parseInt(font);while(px>14){x.font=font.replace(/\d+px/,px+'px');if(x.measureText(txt).width<=maxW)break;px--}return px};
  for(const it of pg.items){const h=hOf(it);
    if(it.head){x.fillStyle='#7c9cff';x.font=`bold 22px ${F}`;x.textAlign='left';x.fillText(it.head,PAD+4,y+h/2+6)}
    else if(it.text){x.textAlign='left';x.fillStyle=it.bold?'#eceef6':'#9aa0b8';const f=`${it.bold?'bold ':''}17px ${F}`;fit(it.text,f,W-PAD*2-8);x.fillText(it.text,PAD+4,y+h/2)}
    else{x.fillStyle=it.g===0?'#2e365c':'#1e2130';x.beginPath();x.roundRect(PAD/2,y+2,W-PAD,h-4,8);x.fill();
      const my=it.s?y+h/2-11:y+h/2;
      if(it.no!==undefined){x.textAlign='center';x.fillStyle='#7c9cff';x.font=`bold 21px ${F}`;x.fillText(it.no,PAD+16,my)}

      const nx=it.no!==undefined?PAD+38:PAD+8,maxN=W-PAD-6-rw-10-nx;

    y+=h}

async function loadXlsxLib(){

const serialToDate=n=>new Date(Math.round((n-25569)*864e5)).toISOString().slice(0,10);
function normDate(h){
  if(typeof h==='number'&&h>20000&&h<80000)return serialToDate(h);
  const m=String(h).trim().match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:null;
}
function parsePowerCell(v){
  if(v===''||v==null)return null;
  if(typeof v==='number')return v>0?Math.round(v*1e6):null;
  const m=String(v).replace(/[, ]/g,'').match(/^(\d+(?:\.\d+)?)([BbMm])$/);
  return m?raw(m[1],m[2].toUpperCase()):null;
}
/* 엑셀 형식: 1행 = 이름 | 직책 | 구분 | 날짜1 | 날짜2 ... , 2행부터 멤버 한 명씩 (전투력은 5.08B / 445.53M 처럼 입력) */
function xlsxToData(buf){
  const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}),head=rows[0]||[];
  const ci=n=>head.findIndex(h=>String(h).trim()===n),iN=ci('이름'),iR=ci('직책'),iG=ci('구분');
  if(iN<0)throw new Error("엑셀 첫 줄에 '이름' 열이 필요합니다");
  const dcols=head.map((h,i)=>({i,d:normDate(h)})).filter(x=>x.d),members=[];
  for(const r of rows.slice(1)){
    const name=String(r[iN]||'').trim();if(!name)continue;
    const history={};dcols.forEach(c=>{const v=parsePowerCell(r[c.i]);if(v)history[c.d]=v});
    members.push({name,role:(iR>=0&&String(r[iR]).trim())||'멤버',guild:!(iG>=0&&String(r[iG]).includes('대기')),history,alt:[]});
  }
  return{members};
}
async function fetchShared(){

  for(const p of ['data/data.json','data.json']){

    if(r&&r.ok){const d=await r.json();if(!d||!Array.isArray(d.members))throw new Error('올바른 공용 데이터 파일이 아닙니다');return d}

}
function planMerge(d){

    if(!lm){newM++;newRec+=Object.keys(sm.history||{}).length;return}
    Object.entries(sm.history||{}).forEach(([dt,v])=>{
      if(!(dt in lm.history))newRec++;
      else if(lm.history[dt]!==v)conf.push({name:sm.name,date:dt,mine:lm.history[dt],shared:v})})});
  return{newM,newRec,conf};
}
function applyMerge(d,picks){
  d.members.forEach(sm=>{const lm=find(sm.name);
    if(!lm){S.members.push({name:sm.name,role:sm.role||'',guild:sm.guild!==false,history:{...(sm.history||{})},alt:sm.alt||[]});return}
    Object.entries(sm.history||{}).forEach(([dt,v])=>{if(!(dt in lm.history))lm.history[dt]=v});
    if(!lm.role&&sm.role)lm.role=sm.role});

}

/* 알터랙 자동 배치 - 순수 로직 모듈 (UI/DOM/저장소와 무관)
 * 명세: alterac/alterac-auto-assign-spec.md

(function(root){

/* ---------------- 상수 ---------------- */
const SLOTS_ALL=['C','F1','F2'].concat(Array.from({length:17},(_,i)=>'G'+(i+1)));   // 주성, 요새1~2, 주둔지1~17
const MARGINS=[0,0.1,0.2,0.3,0.4];
const DEFAULTS={m:0.2,m3:0,midRatio:1.0,midWins:2,zeroOk:true,attacks:3,
  counts:{main:20,cmd:1,emerg:11,finish:8}};

const slotType=k=>k==='C'?'C':k[0]==='F'?'F':'G';
const maxHp=k=>k==='C'?3000:1000;

/* 1회 공격 데미지 (w = 승수 0~5) */
function damage(slot,w){
  if(!(w>=0&&w<=5)||Math.floor(w)!==w)throw new Error('승수는 0~5 정수여야 합니다');
  return slot==='C'?100+180*w:100+80*w;
}
/* 잔여 HP R을 1회 공격으로 처리하는 데 필요한 최소 승수 (6 이상이면 Infinity) */
function requiredWins(slot,R){
  if(R<=0)return 0;
  const per=slot==='C'?180:80,w=Math.max(0,Math.ceil((R-100)/per));
  return w>5?Infinity:w;
}
/* 승수 예측 (보수적): P 공격자 전투력, D 수비 전투력 */
function predictWins(P,D,o){
  o=Object.assign({},DEFAULTS,o||{});
  if(!(D>0))return 0;
  if(P>=D*(1+o.m))return 5;
  if(P>=D*o.midRatio)return o.midWins;
  return 0;
}
/* 인원수에 따른 역할 인원 (40명 미만이면 비상 → 막타 순으로 줄임) */
function roleCounts(n,base){
  const b=Object.assign({},DEFAULTS.counts,base||{});
  const total=b.main+b.cmd+b.emerg+b.finish;
  const deficit=Math.max(0,total-n);
  const emerg=Math.max(0,b.emerg-deficit);
  const finish=Math.max(0,b.finish-Math.max(0,deficit-b.emerg));
  const extra=Math.max(0,n-total);
  return{main:b.main,cmd:n>0?b.cmd:0,emerg:emerg+extra,finish};
}

/* members: [{name,P}]  enemy: {slot:{D}}  opts: {m,commander,midRatio,midWins,counts}

  const tags={};
  for(const x of members){
    const t={};
    for(const ty of ['C','F','G']){const d=minD(ty);t[ty]=d>0?(x.P>=d*(1+o.m)?5:x.P>=d*o.midRatio?o.midWins:0):null}
    tags[x.name]=t;
  }
  return{owners,unassignable,noData,main:Object.values(owners).filter(Boolean),commander:cmdName,finishers,emergency,tags};
}

/* ---------------- 초기 공격 계획 ---------------- */
/* 반환: {slots:{slot:{owner,attacks:[{by,predWins,predDmg}],predTotal,ok,cover}}, needed, total, extraLeft, warnings, reserve:{name:n}} */
function planAttacks(assign,members,enemy,opts){
  const o=Object.assign({},DEFAULTS,opts||{});
  const P={};members.forEach(x=>P[x.name]=x.P);
  const D=k=>(enemy[k]&&enemy[k].D)||0;
  const left={};members.forEach(x=>left[x.name]=o.attacks);
  const slots={},warnings=[];
  for(const k of SLOTS_ALL){
    if(!(D(k)>0))continue;
    const owner=assign.owners[k];
    if(owner){
      const n=k==='C'?3:2,pw=predictWins(P[owner],D(k),o),dm=damage(k,pw);
      const attacks=Array.from({length:n},()=>({by:owner,predWins:pw,predDmg:dm}));
      left[owner]-=n;
      slots[k]={owner,attacks,predTotal:dm*n,ok:dm*n>=maxHp(k),cover:false};
    }
  }
  /* 담당 불가 거점: 비상대기조(+총괄)에서 강한 순으로 예측 데미지 합이 HP 이상이 될 때까지 */
  const emergencyPool=assign.emergency.concat(assign.commander?[assign.commander]:[]).sort((a,b)=>P[b]-P[a]||a.localeCompare(b));
  for(const k of assign.unassignable){
    const attacks=[];let sum=0;
    for(const name of emergencyPool){
      while(left[name]>0&&sum<maxHp(k)){
        const pw=predictWins(P[name],D(k),o),dm=damage(k,pw);
        attacks.push({by:name,predWins:pw,predDmg:dm});sum+=dm;left[name]--;
      }
      if(sum>=maxHp(k))break;
    }
    slots[k]={owner:null,attacks,predTotal:sum,ok:sum>=maxHp(k),cover:true};
    warnings.push({slot:k,type:sum>=maxHp(k)?'cover':'short',msg:slotLabel(k)+(sum>=maxHp(k)?' 담당 불가: 비상대기조로 대응 필요':' 담당 불가 + 공격권 부족')});
  }
  const needed=Object.values(slots).reduce((a,s)=>a+s.attacks.length,0);
  const total=members.length*o.attacks;
  return{slots,needed,total,extraLeft:total-needed,warnings,left};
}

/* ---------------- 실시간 상태 ---------------- */
function initState(members,enemy,opts){
  const o=Object.assign({},DEFAULTS,opts||{});
  const hp={},left={};
  SLOTS_ALL.forEach(k=>{hp[k]=(enemy[k]&&enemy[k].D>0)?((enemy[k].hp!=null)?enemy[k].hp:maxHp(k)):null});
  members.forEach(x=>left[x.name]=o.attacks);
  return{hp,left,log:[]};
}
function castleLocked(state){
  const f=['F1','F2'].filter(k=>state.hp[k]!=null);
  return f.some(k=>state.hp[k]>0);
}
/* 결과 반영 (불변): result={attacker,slot,wins} */
function applyResult(state,result,opts){
  const{attacker,slot,wins}=result;
  if(state.hp[slot]==null)throw new Error('수비 정보가 없는 거점입니다');
  if(state.hp[slot]<=0)throw new Error('이미 함락된 거점입니다');
  if(slot==='C'&&castleLocked(state))throw new Error('요새 2곳을 먼저 함락해야 주성을 공격할 수 있습니다');
  if(!(state.left[attacker]>0))throw new Error('남은 공격권이 없습니다');
  const dm=damage(slot,wins),hp=Object.assign({},state.hp),left=Object.assign({},state.left);
  hp[slot]=Math.max(0,hp[slot]-dm);left[attacker]--;
  const entry=Object.assign({},result,{dmg:dm,hpAfter:hp[slot],id:state.log.length?state.log[state.log.length-1].id+1:1});
  return{hp,left,log:state.log.concat([entry])};
}
function undoLast(initial,state){
  let s=initial;const log=state.log.slice(0,-1);
  for(const e of log)s=applyResult(s,e);
  return s;
}

/* ---------------- 마무리 인원 배정 ---------------- */
/* pool: [{name,P,left,group}] group: 'finisher' | 'emergency' | 'reserve' */
function planFinish(slot,R,D,pool,opts){
  const o=Object.assign({},DEFAULTS,opts||{});
  const left={};pool.forEach(x=>left[x.name]=x.left);
  const seq=[];let rem=R,guard=0;
  const avail=g=>pool.filter(x=>(g?x.group===g:true)&&left[x.name]>0).sort((a,b)=>a.P-b.P||a.name.localeCompare(b.name));
  while(rem>0&&guard++<30){
    const need=requiredWins(slot,rem);
    let pick=null,pw=0;
    if(need===0){
      const order=['finisher','emergency','reserve'];
      for(const g of order){const a=avail(g);if(a.length){pick=a[0];break}}
      if(pick)pw=predictWins(pick.P,D,o);
    }else if(need<=5){
      for(const g of ['emergency','reserve','finisher']){
        const a=avail(g).filter(x=>predictWins(x.P,D,o)>=need);
        if(a.length){pick=a[0];break}
      }
      if(pick)pw=predictWins(pick.P,D,o);
    }else{
      /* 1회로 불가: 가장 강한(예측 승수 높은) 인원부터 깎는다 */
      const a=avail().sort((x,y)=>predictWins(y.P,D,o)-predictWins(x.P,D,o)||y.P-x.P);
      if(a.length){pick=a[0];pw=predictWins(pick.P,D,o)}
    }
    if(!pick)break;
    const dm=damage(slot,pw);
    seq.push({by:pick.name,predWins:pw,predDmg:dm,group:pick.group});
    left[pick.name]--;rem-=dm;
  }
  return{seq,remaining:Math.max(0,rem)};
}

/* ---------------- 실시간 재계산 ---------------- */
/* 아직 실행되지 않은 배정만 다시 계산.
 * 반환: {slots:{slot:{hp,status,needWins,ownerRemaining,finish,remainingAfter}}, unlocked, alerts, underperf} */
function recalc(state,assign,members,enemy,opts){
  const o=Object.assign({},DEFAULTS,opts||{});
  const P={};members.forEach(x=>P[x.name]=x.P);
  const D=k=>(enemy[k]&&enemy[k].D)||0;
  const groupOf=name=>assign.finishers.includes(name)?'finisher':assign.emergency.includes(name)||name===assign.commander?'emergency':'reserve';
  /* 주력의 거점별 예정 공격 수 */
  const planned={};
  for(const k of Object.keys(assign.owners)){if(assign.owners[k])planned[k]=k==='C'?3:2}
  const doneBy={};
  state.log.forEach(e=>{const key=e.slot+'|'+e.attacker;doneBy[key]=(doneBy[key]||0)+1});
  /* 가상 공격권 (마무리 배정에서 중복 사용 방지) */
  const vleft=Object.assign({},state.left);
  const out={},alerts=[],underperf=[];
  const order=SLOTS_ALL.filter(k=>state.hp[k]!=null);
  /* 1차: 담당자 남은 예정 공격 반영 */
  const projected={};
  for(const k of order){
    const hp=state.hp[k];
    const owner=assign.owners[k]||null;
    let ownerRemaining=0,projHp=hp;
    if(hp>0&&owner){
      const rem=Math.max(0,(planned[k]||0)-(doneBy[k+'|'+owner]||0));
      ownerRemaining=Math.min(rem,Math.max(0,vleft[owner]));
      const pw=predictWins(P[owner],D(k),o),dm=damage(k,pw);
      projHp=Math.max(0,hp-dm*ownerRemaining);
      vleft[owner]-=ownerRemaining;
    }
    projected[k]={hp,ownerRemaining,projHp,owner};
  }
  /* 담당 불가 거점은 비상대기조로 먼저 커버 */
  const poolOf=()=>members.map(x=>({name:x.name,P:x.P,left:Math.max(0,vleft[x.name]),group:groupOf(x.name)}));
  for(const k of order){
    const pr=projected[k];let status,finish=[],remainingAfter=0;
    if(pr.hp<=0)status='down';
    else if(k==='C'&&castleLocked(state))status='locked';
    else status='open';
    if(status==='open'&&pr.projHp>0){
      const res=planFinish(k,pr.projHp,D(k),poolOf(),o);
      finish=res.seq;remainingAfter=res.remaining;
      res.seq.forEach(s=>{vleft[s.by]-=1});
    }
    out[k]={hp:pr.hp,status,needWins:pr.hp>0?requiredWins(k,pr.hp):0,ownerRemaining:pr.ownerRemaining,owner:pr.owner,finish,remainingAfter};
    if(k==='C'&&status==='locked'&&pr.projHp>0){/* 잠김 거점은 마무리 계산을 보류 */out[k].finish=[];out[k].remainingAfter=pr.projHp}
  }
  const unlocked=state.hp.F1!=null&&state.hp.F2!=null&&!castleLocked(state);
  if(unlocked&&state.hp.C>0)alerts.push({type:'unlock',msg:'요새 2곳 함락! 주성 공격이 열렸습니다'});
  /* 예측 빗나감 (예상보다 승수 2 이상 적음) */
  state.log.forEach(e=>{
    if(e.pred!=null&&e.pred-e.wins>=2)underperf.push({slot:e.slot,attacker:e.attacker,pred:e.pred,wins:e.wins});
  });
  return{slots:out,unlocked,alerts,underperf,vleft};
}

/* ---------------- 추가 공격시간 ---------------- */
function isExtraTime(state){
  if(state.hp.C==null)return false;
  if(state.hp.C>0)return false;
  return SLOTS_ALL.filter(k=>k[0]==='G'&&state.hp[k]!=null).every(k=>state.hp[k]<=0);
}
/* 남은 공격권을 전투력 높은 순으로 처리 */
function extraTimePlan(state,members,enemy,opts){
  const o=Object.assign({},DEFAULTS,opts||{});
  const D=k=>(enemy[k]&&enemy[k].D)||0;
  const holders=members.filter(x=>state.left[x.name]>0).sort((a,b)=>b.P-a.P||a.name.localeCompare(b.name));
  const weakest=SLOTS_ALL.filter(k=>k[0]==='G'&&D(k)>0).sort((a,b)=>D(a)-D(b)||a.localeCompare(b)).slice(0,3);
  const count={};weakest.forEach(k=>count[k]=0);
  const plan=[];
  for(const h of holders){
    for(let i=0;i<state.left[h.name];i++){
      if(D('C')>0&&h.P>=D('C')*(1+o.m3)){plan.push({by:h.name,slot:'C',reason:'주성 3승 이상 기대',predWins:3});continue}
      const ok=weakest.filter(k=>h.P>=D(k)*(1+o.m)).sort((a,b)=>count[a]-count[b]||D(a)-D(b));
      if(ok.length){const k=ok[0];count[k]++;plan.push({by:h.name,slot:k,reason:'주둔지 5승 기대',predWins:5});continue}
      if(o.zeroOk&&weakest.length){const k=weakest.slice().sort((a,b)=>count[a]-count[b]||D(a)-D(b))[0];count[k]++;plan.push({by:h.name,slot:k,reason:'0승 공격(허용)',predWins:0});continue}
      plan.push({by:h.name,slot:null,reason:'공격 보류',predWins:0});
    }
  }
  return{plan,weakest};
}

/* ---------------- 마진별 비교 ---------------- */
function compareMargins(members,enemy,opts){
  return MARGINS.map(m=>{
    const o=Object.assign({},opts||{},{m});
    const a=assignRoles(members,enemy,o),p=planAttacks(a,members,enemy,o);
    return{m,assigned:Object.values(a.owners).filter(Boolean).length,
      slotsWithData:Object.keys(a.owners).length,unassignable:a.unassignable.slice(),
      needed:p.needed,extraLeft:p.extraLeft,total:p.total};
  });
}

const RATIO_BINS=[[0,0.5,'<0.5'],[0.5,0.75,'0.5~0.75'],[0.75,1,'0.75~1'],[1,1.25,'1~1.25'],[1.25,1.5,'1.25~1.5'],[1.5,2,'1.5~2'],[2,Infinity,'2 이상']];

function boardClean(){
  const a=AB(),b=a.board,ok=new Set(pool(false).map(m=>m.name));
  for(const k of Object.keys(b.owners))if(b.owners[k]&&!ok.has(b.owners[k]))b.owners[k]=null;

  }

    <button class="btn sec" data-act="eup">📷 적</button><button class="btn" data-act="boardauto">🤖 자동</button>
    <select data-aset="m" title="안전마진">${AlterAC.MARGINS.map(m=>`<option value="${m}"${a.set.m===m?' selected':''}>${Math.round(m*100)}%</option>`).join('')}</select>
    <button class="btn sec" data-act="copyalt" title="복사">📋</button><button class="btn sec" data-act="img" data-k="alt" title="이미지">🖼</button><button class="btn sec" data-act="tbl" data-k="alt" title="엑셀">📊</button><button class="btn dg" data-act="boardreset" title="비우기">↺</button>
    <input type="file" id="efiles" accept="image/*" multiple hidden></div>
  <div class="aaboard" id="aaboard">
    <div class="pane p1" data-pane="0" data-drop-pane="1">${cmdRow}${rows}<div class="rsep"></div>${roles}<div class="sub" id="est" style="text-align:center;padding:4px">점선 칸에 길드원을 끌어다 놓거나, 길드원을 누른 뒤 점선 칸을 누르세요</div></div>
    <div class="pane p2" data-pane="1"><div class="psub">길드원 · 미배정 ${free.length}명 <span class="sub">(여기로 끌어오면 배치 해제)</span></div>
      <div class="pgrid" data-drop="pool">${free.map(m=>boardChip(m.name)).join('')||'<div class="sub" style="grid-column:1/-1;text-align:center;padding:10px">모두 배치되었습니다</div>'}</div></div>
  </div>`;
  fitBoard();
  const ps=document.querySelectorAll('[data-pane]');if(ps.length===2){ps[0].scrollTop=aaScroll[0];ps[1].scrollTop=aaScroll[1]}
}
function fitBoard(){
  const bd=$('aaboard');if(!bd)return;
  const top=bd.getBoundingClientRect().top,nav=document.querySelector('nav').offsetHeight;
  bd.style.height=Math.max(260,innerHeight-top-nav-8)+'px';
  const p=bd.querySelector('.pane'),W=p?p.clientWidth-8:340;
  const BW=81,H=75;    // 넓은 화면이면 81, 좁으면 줄어듦
  const gg=W>=4*BW+6+28?28:24;
  const bw=Math.max(40,Math.min(BW,Math.floor((W-6-gg)/4)));
  const rbw=Math.max(40,Math.min(BW,Math.floor((W-4*8)/5)));
  bd.style.setProperty('--bw',bw+'px');bd.style.setProperty('--bh',H+'px');bd.style.setProperty('--rbw',rbw+'px');bd.style.setProperty('--gg',gg+'px');
  const fs=w=>Math.max(9,Math.min(20,Math.floor((w-9)/5)));      // 5글자가 한 줄에 들어가는 최대 크기 (최대 20px = 기존의 2배)
  const pw=(W-4*6)/5;
  bd.style.setProperty('--nfs',fs(bw)+'px');bd.style.setProperty('--rfs',fs(rbw)+'px');bd.style.setProperty('--pfs',fs(pw)+'px');
  bd.classList.toggle('tight',rbw<62);
}
addEventListener('resize',fitBoard);
/* ---- 드래그 (터치: 길게 눌러 시작, 마우스: 끌면 시작) ---- */
let drag=null,dTimer=null,dStart=null,dScroll=null;
function dragBegin(chipEl,x,y){
  const name=chipEl.dataset.chip;if(!name)return;
  const g=chipEl.cloneNode(true);g.className+=' ghost';g.style.width=chipEl.offsetWidth+'px';g.style.height=chipEl.offsetHeight+'px';
  const gc=g.querySelector('.cn'),oc=chipEl.querySelector('.cn');if(gc&&oc)gc.style.fontSize=getComputedStyle(oc).fontSize;document.body.appendChild(g);
  drag={name,g,x,y};chipEl.classList.add('dragging');dragMove(x,y);
  dScroll=setInterval(()=>{if(!drag)return;
    document.querySelectorAll('[data-pane]').forEach(p=>{const r=p.getBoundingClientRect();
      if(drag.x>=r.left&&drag.x<=r.right&&drag.y>=r.top&&drag.y<=r.bottom){if(drag.y<r.top+42)p.scrollTop-=14;else if(drag.y>r.bottom-42)p.scrollTop+=14}})},30);
}
function dragMove(x,y){
  if(!drag)return;drag.x=x;drag.y=y;
  drag.g.style.left=(x-drag.g.offsetWidth/2)+'px';drag.g.style.top=(y-drag.g.offsetHeight-14)+'px';
  document.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));
  const el=document.elementFromPoint(x,y),z=el&&el.closest('[data-drop]');if(z)z.classList.add('hot');
}
function dragEnd(x,y){
  if(!drag)return;
  const d=drag;drag=null;clearInterval(dScroll);d.g.remove();
  document.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));
  const el=document.elementFromPoint(x,y),z=el&&el.closest('[data-drop]');
  aaJustDragged=true;setTimeout(()=>aaJustDragged=false,60);
  if(z){boardDrop(d.name,z.dataset.drop);aaSel=null;save()}
  vAlt();
}
document.addEventListener('touchstart',e=>{
  const c=e.target.closest&&e.target.closest('[data-chip]');if(!c||tab!=='alt')return;
  const t=e.touches[0];dStart={x:t.clientX,y:t.clientY};
  dTimer=setTimeout(()=>{dTimer=null;dragBegin(c,dStart.x,dStart.y);if(navigator.vibrate)navigator.vibrate(15)},200);
},{passive:true});
document.addEventListener('touchmove',e=>{
  const t=e.touches[0];
  if(drag){e.preventDefault();dragMove(t.clientX,t.clientY);return}
  if(dTimer&&dStart&&Math.hypot(t.clientX-dStart.x,t.clientY-dStart.y)>8){clearTimeout(dTimer);dTimer=null}
},{passive:false});
document.addEventListener('touchend',e=>{clearTimeout(dTimer);dTimer=null;if(drag){const t=e.changedTouches[0];dragEnd(t.clientX,t.clientY)}});
document.addEventListener('touchcancel',()=>{clearTimeout(dTimer);dTimer=null;if(drag){drag.g.remove();clearInterval(dScroll);drag=null;vAlt()}});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-chip]'))e.preventDefault()});
let mDown=null;
document.addEventListener('mousedown',e=>{const c=e.target.closest&&e.target.closest('[data-chip]');if(!c||tab!=='alt'||e.button!==0)return;mDown={c,x:e.clientX,y:e.clientY}});
document.addEventListener('mousemove',e=>{
  if(drag){dragMove(e.clientX,e.clientY);return}
  if(mDown&&Math.hypot(e.clientX-mDown.x,e.clientY-mDown.y)>5){const c=mDown.c;mDown=null;dragBegin(c,e.clientX,e.clientY)}
});
document.addEventListener('mouseup',e=>{mDown=null;if(drag)dragEnd(e.clientX,e.clientY)});
/* ---- 누르기 방식 (길드원 선택 → 점선 칸 선택) ---- */
function boardTap(t){
  if(aaJustDragged)return true;
  const chip=t.closest('[data-chip]'),zone=t.closest('[data-drop]');
  if(chip&&!(aaSel&&aaSel!==chip.dataset.chip&&zone&&zone.dataset.drop!=='pool')){
    aaSel=aaSel===chip.dataset.chip?null:chip.dataset.chip;vAlt();return true}
  if(zone&&aaSel){boardDrop(aaSel,zone.dataset.drop);aaSel=null;save();vAlt();return true}
  return false;
}
/* ---- 결과물: 요약 / 이미지 / 표 / 복사 ---- */
function boardPlaceLabel(name){
  const p=boardPlace(name);if(!p)return'';
  return p.t==='slot'?eLabel(p.k):p.t==='cmd'?'총괄':p.t==='emerg'?'비상':'막타';
}
function boardLines(){
  const b=AB().board,lines=[];
  ECODES.forEach(k=>{const e=eget(k);lines.push({slot:k,label:eLabel(k),D:e.p||0,who:b.owners[k]||''})});
  return lines;
}

function boardCopyText(){
  const b=AB().board,L=[];
  ECODES.forEach(k=>{const e=eget(k),who=b.owners[k];if(who||e.p)L.push(eLabel(k)+(e.p?' ('+fmt(e.p)+')':'')+' : '+(who||'-'))});
  L.push('총괄지휘 : '+(b.cmd||'-'));L.push('비상대기조 ('+b.emerg.length+') : '+b.emerg.join(', '));L.push('막타조 ('+b.finish.length+') : '+b.finish.join(', '));
  return L.join('\n');
}
/* ---------- 이벤트 ---------- */
function copyText(t){
  const legacy=()=>{try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}};
  return(navigator.clipboard?navigator.clipboard.writeText(t).then(()=>true,()=>legacy()):Promise.resolve(legacy()));
}
const copy=(t,msg)=>copyText(t).then(ok=>ok?alert(msg||'복사되었습니다'):prompt('복사하세요',t));
const M=n=>+(n/1e6).toFixed(3);
function tableData(k){
  if(k==='rank')return[['순위','이름','직책','구분','전투력','전투력(M)','기록일']].concat(rankPool(S.filters.rank).map((m,i)=>[i+1,m.name,m.role,m.guild?'길드원':'대기',fmt(latest(m)),M(latest(m)),latestDate(m)]));
  if(k==='change')return[['전투력순위',mLabel()+'순위','이름','기준','이전(M)','현재(M)','성장 전투력(M)','성장률(%)','이전일','현재일']].concat(changes(S.filters.change).map(c=>[c.pr,c.rr||'',c.m.name,cLabel(),c.a?M(c.a):'',M(c.b),c.pct===null?'':M(c.diff),c.pct===null?'':+c.pct.toFixed(2),c.d0||'',c.d1]));
  if(k==='party'){const r=[['파티','이름','전투력','전투력(M)']];parties().forEach((g,i)=>g.forEach(e=>r.push([i+1,e.m.name,fmt(e.p),M(e.p)])));return r}
  {const b=AB().board,r=[['구분','자리','적 전투력(M)','담당','담당 전투력(M)']],P=n=>{const m=find(n);return m?M(latest(m)):''};
    ECODES.forEach(k=>{const e=eget(k),who=b.owners[k]||'';r.push(['주력',eLabel(k),e.p?M(e.p):'',who,who?P(who):''])});
    if(b.cmd)r.push(['총괄','','',b.cmd,P(b.cmd)]);b.emerg.forEach(n=>r.push(['비상','','',n,P(n)]));b.finish.forEach(n=>r.push(['막타','','',n,P(n)]));return r}
}
function copyTable(k){const t=tableData(k);if(t.length<2)return alert('복사할 명단이 없습니다');copy(t.map(r=>r.join('\t')).join('\n'),'표가 복사되었습니다. 엑셀에서 붙여넣기(Ctrl+V) 하세요.')}
document.addEventListener('click',e=>{
  if(tab==='alt'&&boardTap(e.target))return;
  const t=e.target.closest('button,[data-edit],[data-ek]');if(!t)return;
  if(t.dataset.ek){openEnemy(t.dataset.ek);return}
  if(t.dataset.cmetric){S.cmetric=t.dataset.cmetric;save();render();return}
  if(t.dataset.cmode){S.cmode=t.dataset.cmode;save();render();return}
  if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0);return}
  if(t.dataset.edit!==undefined){openSheet(t.dataset.edit);return}
  if(t.dataset.rm!==undefined){draft.splice(+t.dataset.rm,1);renderDraft();return}
  if(t.dataset.delh){const m=find($('sheet').dataset.orig);if(m&&confirm(t.dataset.delh+' 기록을 삭제할까요?')){delete m.history[t.dataset.delh];save();openSheet(m.name);render()}return}
  if(t.dataset.edh){const m=find($('sheet').dataset.orig),d=t.dataset.edh,v=m.history[d];$('s_unit').value=v>=1e9?'B':'M';$('s_val').value=+(v>=1e9?v/1e9:v/1e6).toFixed(3);$('s_date').value=d;$('s_val').focus();return}
  if(t.dataset.sheet==='merge'){const m=find($('sheet').dataset.orig),to=find($('s_merge').value);if(!to)return alert('합칠 멤버를 선택하세요');if(!confirm(m.name+' 의 기록을 '+to.name+' 에 합치고 '+m.name+' 은(는) 삭제합니다.'))return;Object.keys(m.history).forEach(d=>{if(!(d in to.history))to.history[d]=m.history[d]});S.members=S.members.filter(x=>x!==m);save();$('sheet').innerHTML='';render();return}
  if(t.dataset.sheet==='close'){$('sheet').innerHTML='';return}
  if(t.dataset.sheet==='save')return sheetSave();
  if(t.dataset.sheet==='del'){if(confirm('이 멤버와 모든 기록을 삭제할까요?')){S.members=S.members.filter(m=>m.name!==$('sheet').dataset.orig);save();$('sheet').innerHTML='';render()}return}
  switch(t.dataset.act){
    case'add':openSheet(null);break;
    case'ocr':runOcr();break;
    case'addrow':draft.push({name:'',val:'',unit:'B',role:''});renderDraft();break;
    case'commit':commit();break;
    case'csort':S.csort=(S.csort||'power')==='rate'?'power':'rate';save();render();break;
    case'shared':loadShared(false);break;
    case'cfmine':setAllPicks('mine');break;
    case'cfshared':setAllPicks('shared');break;
    case'cfapply':applyPicks();break;
    case'cfcancel':$('sheet').innerHTML='';window.__pending=null;break;
    case'rankpow':S.rankPower=!S.rankPower;save();render();break;
    case'qadd':quickAdd();break;
    case'qatoggle':qaOpen=!qaOpen;render();if(qaOpen&&$('qa_name'))$('qa_name').focus();break;
    case'vcYes':$('sheet').innerHTML='';window.__vc=null;break;
    case'vcNo':vcNo();break;
    case'wzYes':case'wzNo':case'wzNew':case'wzNotNew':case'wzPick':case'wzSkip':case'wzCancel':wzAction(t.dataset.act);break;
    case'roles':openRoles();break;
    case'rolesave':saveRoles();break;
    case'boardauto':autoBoard();break;
    case'boardreset':if(confirm('배치를 모두 비울까요? (적 전투력은 유지됩니다)')){S.aa=S.aa||{};S.aa.board={owners:{},cmd:null,emerg:[],finish:[]};aaSel=null;save();render()}break;
    case'eup':$('efiles').click();break;
    case'eclear':if(confirm('적 정보를 모두 비울까요?')){S.enemy={};save();render()}break;
    case'esave':saveEnemy();break;
    case'eapply':applyEnemy();break;
    case'img':saveImage(t.dataset.k);break;
    case'tbl':copyTable(t.dataset.k);break;
    case'copyparty':copy(parties().map((g,i)=>`[${i+1}파티] `+g.map(e=>e.m.name).join(', ')).join('\n'));break;
    case'copyalt':copy(boardCopyText());break;
    case'export':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`guild-backup-${today()}.json`;a.click();break}
    case'import':$('imp').click();break;
    case'wipe':if(confirm('모든 데이터를 삭제합니다. 계속할까요?')){S={members:[],filters:{rank:false,change:false,party:false}};save();render()}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.aset==='m'){AB().set.m=+t.value;save();vAlt();return}
  if(t.dataset.pdate!==undefined){S.pdate=t.value;save();render();const pm=partyMissing();if(pm.length)alert('⚠ '+missMsg(partyDate(),pm)+'\n\n이 멤버들은 파티에 포함되지 않습니다.')}
  else if(t.dataset.filter){S.filters[t.dataset.filter]=t.checked;save();render()}
  else if(t.id==='efiles'&&t.files.length){const fl=[...t.files];t.value='';runEnemyOcr(fl)}
  else if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.members)throw 0;S=d;S.filters=S.filters||{};save();render();alert('복원 완료')}catch(_){alert('올바른 백업 파일이 아닙니다')}};r.readAsText(t.files[0])}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='qa_name'){e.preventDefault();$('qa_val').focus()}else if(e.target.id==='qa_val'){e.preventDefault();quickAdd()}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.i!==undefined)draft[+t.dataset.i][t.dataset.f]=t.value});
render();
if(!S.members.length)loadShared(true);
</script>
</body>
