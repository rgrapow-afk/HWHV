<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161f">
<title>호드워 천국 길드</title>
<style>
:root{--bg:#14161f;--card:#1e2130;--card2:#272b3f;--tx:#eceef6;--sub:#9aa0b8;--ac:#7c9cff;--up:#4ade80;--down:#f87171;--warn:#fbbf24;--bd:#333852}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Noto Sans KR",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--bd)}
h1{margin:0;font-size:18px}
.sub{color:var(--sub);font-size:13px}
main{padding:12px 14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--sub);padding:10px 2px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--ac)}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:10px;padding:11px 12px;margin-bottom:6px}
.row .no{width:30px;text-align:center;font-weight:700;color:var(--ac);flex:none}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--sub);margin-left:4px}
.badge.w{background:#4a3b12;color:var(--warn)}
.up{color:var(--up)}.down{color:var(--down)}
button.btn{background:var(--ac);color:#0b0e1a;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700}
button.btn.sec{background:var(--card2);color:var(--tx)}
button.btn.dg{background:#5b2227;color:#fecaca}
button.btn.sm{padding:6px 10px;font-size:13px}
input,select{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:16px;width:100%}
input[type=checkbox]{width:auto}
.tog{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-radius:10px;margin-bottom:10px}
.tog input{width:22px;height:22px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.bar>*{flex:1 1 40%}
.warnbox{background:#4a2b12;color:#fde68a;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.party h3{margin:0 0 6px;font-size:15px;color:var(--ac)}
.party div.m{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--bd)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;width:100%;height:100%;margin:0}
.chips span{display:block;min-width:38px;text-align:center;padding:7px 0;border-radius:8px;background:var(--card2);color:var(--sub);font-weight:700;border:1px solid var(--bd)}
.chips input:checked+span{background:var(--ac);color:#0b0e1a;border-color:var(--ac)}
.legend div{font-size:13px;padding:2px 0}
.legend b{color:var(--ac);display:inline-block;width:18px}
.drow{display:grid;grid-template-columns:1.4fr 1fr .7fr 1fr 34px;gap:5px;margin-bottom:6px}
.drow.warn input{border-color:var(--warn)}
.drow input,.drow select{padding:8px 6px;font-size:14px}
.drow button{background:#5b2227;color:#fecaca;border:0;border-radius:8px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet label{display:block;margin:10px 0 4px;font-size:13px;color:var(--sub)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd);font-size:14px}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
</style>
</head>
<body>
<header><h1>🏰 호드워 · 천국 길드</h1><div class="sub" id="hsub"></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheet"></div>

<script>
const KEY='hodwar-heaven-v1';
const ALT=[
 ['A','[최우선공격조]','불안탄 요새'],['B','[최우선공격조]','불안탄 주성'],
 ['C','[공격조1]','주둔지 1-9'],['D','[공격조2]','주둔지 10-17'],
 ['E','[비상대기조]','주성'],['F','[비상대기조]','주둔지'],['G','[막타조]','막타']];
const ROLE_WORDS=['부길드마스터','길드마스터','부길드장','길드장','부마스터','마스터','장로','간부','정예','길드원','멤버'];
const TABS=[['rank','🏆','순위'],['change','📈','변화'],['party','⚔️','파티'],['alt','🛡️','알터렉'],['input','📷','입력']];

let S=load(); let tab='rank'; let draft=[];
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.members)return s}catch(e){}return{members:[],filters:{rank:false,change:false,party:false}}}
let STORE_OK=true,SAVED_AT='';
function probeStore(){try{localStorage.setItem(KEY+'-probe','1');const ok=localStorage.getItem(KEY+'-probe')==='1';localStorage.removeItem(KEY+'-probe');return ok}catch(e){return false}}
function save(){
  try{const j=JSON.stringify(S);localStorage.setItem(KEY,j);if(localStorage.getItem(KEY)!==j)throw new Error('verify');STORE_OK=true;SAVED_AT=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
  catch(e){STORE_OK=false;alert('⚠ 이 브라우저에서는 데이터가 저장되지 않습니다.\n웹 주소(https)로 접속했는지 확인하고, 임시로 [입력] 탭의 백업(파일)을 사용하세요.')}
}
STORE_OK=probeStore();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const raw=(v,u)=>Math.round(parseFloat(v)*(u==='B'?1e9:1e6));
function fmt(n){return n>=1e9?(+(n/1e9).toFixed(3))+'B':(+(n/1e6).toFixed(2))+'M'}
const dates=m=>Object.keys(m.history).sort();
const latest=m=>{const d=dates(m);return d.length?m.history[d[d.length-1]]:0};
const latestDate=m=>{const d=dates(m);return d[d.length-1]||''};
const find=n=>S.members.find(m=>m.name===n);
function pool(include){return S.members.filter(m=>(include||m.guild)&&dates(m).length).sort((a,b)=>latest(b)-latest(a))}
function toggle(key){return `<label class="tog"><input type="checkbox" data-filter="${key}" ${S.filters[key]?'checked':''}> 길드 외(가입대기 등) 포함</label>`}
const badges=m=>(m.role?`<span class="badge">${esc(m.role)}</span>`:'')+(m.guild?'':'<span class="badge w">대기</span>');

function render(){
  $('nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-tab="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
  const g=S.members.filter(m=>m.guild).length;
  const all=S.members.flatMap(dates).sort().pop();
  $('hsub').textContent=`길드원 ${g}명 · 최근 기록 ${all||'없음'} · `+(STORE_OK?(SAVED_AT?'💾 저장됨 '+SAVED_AT:'💾 자동저장 켜짐'):'⚠ 저장 불가');
  ({rank:vRank,change:vChange,party:vParty,alt:vAlt,input:vInput})[tab]();
  if(!STORE_OK)$('main').insertAdjacentHTML('afterbegin','<div class="warnbox">⚠ 이 화면에서는 <b>데이터가 저장되지 않습니다</b>. 파일을 직접 열었거나(file:// , 앱 미리보기, 시크릿 모드) 저장이 막힌 상태예요. 크롬에서 <b>웹 주소(https)</b>로 접속하세요. 그 전에는 [입력] 탭의 <b>백업(파일)</b>으로 데이터를 보관하세요.</div>');
}

function vRank(){
  const l=pool(S.filters.rank);
  $('main').innerHTML=toggle('rank')+`<div class="bar"><button class="btn sec" data-act="add">＋ 대기자/멤버 추가</button>${IMGBTN('rank')}</div>`+
  (l.length?l.map((m,i)=>`<div class="row" data-edit="${esc(m.name)}"><div class="no">${i+1}</div><div class="nm"><b>${esc(m.name)}${badges(m)}</b><span class="sub">${latestDate(m)} · ✏️ 눌러서 수정</span></div><div class="val"><b>${fmt(latest(m))}</b></div></div>`).join(''):'<div class="empty">데이터가 없습니다.<br>[입력] 탭에서 캡처를 올려주세요.</div>');
}

const CMODES=[['prev','직전',0],['week','주간',7],['month','월간',30]];
const dayDiff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
function changes(include){
  const mode=S.cmode||'prev',sortBy=S.csort||'power',cm=CMODES.find(x=>x[0]===mode),need=mode==='week'?4:mode==='month'?15:1;
  const rows=pool(include).map(m=>{
    const d=dates(m),d1=d[d.length-1],b=m.history[d1];let d0=null;
    if(d.length>1){
      if(mode==='prev')d0=d[d.length-2];
      else{let bd=1e9;for(const x of d.slice(0,-1)){const gap=dayDiff(d1,x);if(gap<need)continue;const diff=Math.abs(gap-cm[2]);if(diff<bd){bd=diff;d0=x}}}
    }
    const a=d0?m.history[d0]:null;
    return{m,b,a,d0,d1,pct:a?(b-a)/a*100:null}});
  rows.forEach((r,i)=>r.pr=i+1);
  const w=rows.filter(r=>r.pct!==null).sort((x,y)=>y.pct-x.pct);w.forEach((r,i)=>r.rr=i+1);
  return sortBy==='rate'?[...w,...rows.filter(r=>r.pct===null)]:rows;
}
const cLabel=()=>CMODES.find(x=>x[0]===(S.cmode||'prev'))[1];
function vChange(){
  const inc=S.filters.change,l=changes(inc),rate=(S.csort||'power')==='rate',mode=S.cmode||'prev';
  const ctl=`<div class="bar">${CMODES.map(c=>`<button class="btn ${c[0]===mode?'':'sec'}" data-cmode="${c[0]}">${c[1]}</button>`).join('')}</div>
  <div class="bar"><button class="btn ${rate?'':'sec'}" data-act="csort">${rate?'✓ 변화율 순위순 (눌러서 해제)':'📈 변화율 순위로 보기'}</button></div>`;
  const row=c=>{const up=c.pct!==null&&c.pct>=0;
    return `<div class="row" data-edit="${esc(c.m.name)}"><div class="no">${rate?c.rr||'-':c.pr}</div><div class="nm"><b>${esc(c.m.name)}${badges(c.m)}</b><span class="sub">${c.pct===null?'비교할 기록 없음 · 현재 '+fmt(c.b):`${fmt(c.a)} → ${fmt(c.b)}<br>${c.d0} → ${c.d1}`}<br>${rate?'전투력 '+c.pr+'위':(c.rr?'변화율 '+c.rr+'위':'')}</span></div><div class="val ${c.pct===null?'':up?'up':'down'}"><b>${c.pct===null?'-':(up?'+':'')+c.pct.toFixed(2)+'%'}</b></div></div>`};
  $('main').innerHTML=toggle('change')+ctl+(l.length?`<div class="bar">${IMGBTN('change')}</div>`+l.map(row).join(''):'<div class="empty">데이터가 없습니다.</div>')+
  (l.length&&!l.some(c=>c.pct!==null)?'<div class="empty">'+cLabel()+' 기준으로 비교할 기록이 없습니다.<br>날짜를 달리해서 입력하면 표시됩니다.</div>':'');
}

function parties(){const l=pool(S.filters.party),r=[];for(let i=0;i<l.length;i+=3)r.push(l.slice(i,i+3));return r}
function vParty(){
  const p=parties();
  $('main').innerHTML=toggle('party')+(p.length?`<div class="bar"><button class="btn sec" data-act="copyparty">📋 명단 복사</button>${IMGBTN('party')}</div>`+
  p.map((g,i)=>`<div class="card party"><h3>${i+1}파티</h3>${g.map(m=>`<div class="m"><span>${esc(m.name)}${badges(m)}</span><b>${fmt(latest(m))}</b></div>`).join('')}</div>`).join(''):'<div class="empty">데이터가 없습니다.</div>');
}

function vAlt(){
  const l=pool(false);
  const sum=ALT.map(a=>{const n=l.filter(m=>(m.alt||[]).includes(a[0])).map(m=>m.name);return `<div class="legend"><div><b>${a[0]}</b>${a[1]} ${a[2]} <span class="sub">(${n.length}명)</span></div>${n.length?`<div class="sub" style="padding-left:18px">${n.map(esc).join(', ')}</div>`:''}</div>`}).join('');
  $('main').innerHTML=`<div class="card legend">${ALT.map(a=>`<div><b>${a[0]}</b>${a[1]} ${a[2]}</div>`).join('')}</div>`+
  (l.length?l.map((m,i)=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${i+1}. ${esc(m.name)}${badges(m)}</b><span class="sub">${fmt(latest(m))}</span></div><div class="chips">${ALT.map(a=>`<label><input type="checkbox" data-alt="${a[0]}" data-n="${esc(m.name)}" ${(m.alt||[]).includes(a[0])?'checked':''}><span>${a[0]}</span></label>`).join('')}</div></div>`).join('')+
  `<div class="card"><b>조 편성 요약</b><div style="margin-top:6px">${sum}</div></div><div class="bar"><button class="btn sec" data-act="copyalt">📋 요약 복사</button>${IMGBTN('alt')}<button class="btn dg" data-act="resetalt">전체 해제</button></div>`:'<div class="empty">길드원 데이터가 없습니다.</div>');
}

function vInput(){
  $('main').innerHTML=`<div class="card"><b>1. 캡처 업로드</b>
  <label class="sub">기록 날짜</label><input type="date" id="dt" value="${today()}">
  <label class="sub" style="margin-top:8px;display:block">길드원 목록 캡처 (여러 장 선택 가능)</label><input type="file" id="files" accept="image/*" multiple>
  <div class="bar" style="margin-top:10px"><button class="btn" data-act="ocr">분석 시작</button><button class="btn sec" data-act="addrow">직접 입력</button></div>
  <div class="sub" id="st">이미지에서 이름·전투력·직책을 읽습니다. 처음 1회는 언어 데이터 다운로드로 오래 걸릴 수 있어요. 결과는 아래에서 꼭 확인/수정하세요.</div></div>
  <div class="card"><b>2. 확인 및 수정</b><div class="drow sub" style="margin-top:8px"><span>이름</span><span>전투력</span><span>단위</span><span>직책</span><span></span></div><div id="draft"></div>
  <label class="tog"><input type="checkbox" id="demote"> 이번 목록에 없는 기존 길드원은 '대기(길드 외)'로 변경</label>
  <button class="btn" style="width:100%" data-act="commit">저장하기</button></div>
  <div class="card"><b>데이터 관리</b><div class="sub">데이터는 이 폰의 브라우저에만 저장됩니다. 기기 변경 시 백업/복원을 사용하세요.</div>
  <div class="bar" style="margin-top:8px"><button class="btn sec" data-act="export">백업(파일)</button><button class="btn sec" data-act="import">복원</button></div>
  <button class="btn dg sm" data-act="wipe">전체 초기화</button><input type="file" id="imp" accept=".json" hidden></div>`;
  renderDraft();
}
function renderDraft(){
  const el=$('draft');if(!el)return;
  el.innerHTML=draft.length?draft.map((r,i)=>`<div class="drow${r.warn?' warn':''}"><input data-i="${i}" data-f="name" value="${esc(r.name)}"><input data-i="${i}" data-f="val" inputmode="decimal" value="${esc(r.val)}"><select data-i="${i}" data-f="unit"><option ${r.unit==='B'?'selected':''}>B</option><option ${r.unit==='M'?'selected':''}>M</option></select><input data-i="${i}" data-f="role" value="${esc(r.role)}"><button data-rm="${i}">✕</button></div>`).join(''):'<div class="sub">분석 결과가 여기에 표시됩니다.</div>';
}

/* ---------- OCR ---------- */
async function loadTess(){if(window.Tesseract)return;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=ok;s.onerror=()=>no(new Error('OCR 라이브러리 로딩 실패 (인터넷 연결 확인)'));document.head.appendChild(s)})}
/* ===== 길드 화면 인식 (가로 720px 기준으로 정규화 후 카드 6장/141px 간격) ===== */
const LAY={top:495,bot:1342,pitch:141,nameY:39,powY:67,roleY:95,ratio:1560/720};

  const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
  const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';
  x.drawImage(cv.c,l,t,w,h,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data,n=c.width*c.height,hist=new Array(256).fill(0);
  if(lum)for(let i=0;i<n;i++)p[i*4+1]=(p[i*4]*.3+p[i*4+1]*.59+p[i*4+2]*.11)|0;
  for(let i=0;i<n;i++)hist[p[i*4+1]]++;
  let lo=0,hi=255,a=0;for(;lo<255&&(a+=hist[lo])<n*.01;lo++);a=0;for(;hi>0&&(a+=hist[hi])<n*.01;hi--);
  const r=Math.max(1,hi-lo);
  for(let i=0;i<n;i++){const g=Math.max(0,Math.min(255,(p[i*4+1]-lo)*255/r));p[i*4]=p[i*4+1]=p[i*4+2]=g}
  x.putImageData(d,0,0);return c;
}
function findPhase(cv){
  const rows=[],P=LAY.pitch;
  for(let y=LAY.top;y<Math.min(cv.H,LAY.bot);y++){let s=0,n=0;for(let x=30;x<690;x+=3,n++)s+=cv.px[(y*cv.W+x)*4+1];rows.push([s/n,y])}
  rows.sort((a,b)=>a[0]-b[0]);
  const ph=rows.slice(0,10).map(r=>r[1]%P);let bp=0,best=[];
  for(const q of ph){const g=ph.filter(z=>Math.abs(z-q)<4||Math.abs(z-q)>P-4);if(g.length>best.length){best=g;bp=q}}
  return bp;
}
/* --- 전투력: 붉은 글자 채움색만 뽑아 글자별로 잘라 템플릿과 비교 --- */
function blobs(mask,w,h){
  const lab=new Int32Array(w*h),out=[];let id=0;
  for(let i=0;i<w*h;i++){if(!mask[i]||lab[i])continue;id++;const st=[i];lab[i]=id;let x0=w,x1=0,y0=h,y1=0,n=0;
    while(st.length){const p=st.pop(),px=p%w,py=(p/w)|0;n++;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const q=ny*w+nx;if(mask[q]&&!lab[q]){lab[q]=id;st.push(q)}}}
    out.push({x0,x1,y0,y1,n,id})}
  return{out,lab};
}
function glyphFeat(b,lab,w){
  const bw=b.x1-b.x0+1,bh=b.y1-b.y0+1,f=new Float32Array(GW*GH);
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const sx0=b.x0+gx*bw/GW,sx1=b.x0+(gx+1)*bw/GW,sy0=b.y0+gy*bh/GH,sy1=b.y0+(gy+1)*bh/GH;let s=0,c=0;
    for(let y=Math.floor(sy0);y<Math.ceil(sy1);y++)for(let x=Math.floor(sx0);x<Math.ceil(sx1);x++){c++;if(lab[y*w+x]===b.id)s++}
    f[gy*GW+gx]=c?s/c:0}
  return{f,ar:bw/bh,hh:bh/20};
}
function glyphClass(g,allow){
  let best=null,bd=1e9;
  for(const t of TPL){if(!allow.includes(t.ch))continue;let s=0;for(let i=0;i<g.f.length;i++){const d=g.f[i]-t.f[i];s+=d*d}
    s+=3*(g.ar-t.ar)**2+6*(g.hh-t.hh)**2;if(s<bd){bd=s;best=t}}
  return{ch:best.ch,d:bd};
}
function readPower(cv,d){
  const x0=146,w=118,y0=d+LAY.powY-18,h=38,mask=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=((y0+y)*cv.W+x0+x)*4;mask[y*w+x]=(cv.px[i]-cv.px[i+1]>55)?1:0}
  const{out,lab}=blobs(mask,w,h);
  const bs=out.filter(b=>b.n>=8&&b.y1-b.y0>=3).sort((a,b)=>a.x0-b.x0);
  let txt='',worst=0;
  bs.forEach((b,i)=>{const c=glyphClass(glyphFeat(b,lab,w),i===bs.length-1?'BM':'0123456789.');txt+=c.ch;worst=Math.max(worst,c.d)});
  const m=txt.match(/^(\d{1,3}\.\d{1,2})([BM])$/);
  return m?{val:m[1],unit:m[2],ok:worst<1.2}:null;
}
/* --- 직책: 배너 색으로 구분 --- */
function readRole(cv,d){
  let r=0,g=0,b=0,n=0;
  for(let y=d+LAY.roleY-5;y<=d+LAY.roleY+5;y++)for(let x=118;x<=205;x+=2){const i=(y*cv.W+x)*4;r+=cv.px[i];g+=cv.px[i+1];b+=cv.px[i+2];n++}
  r/=n;g/=n;b/=n;
  if(r>170&&g>130)return'멤버';
  if(b>r+10&&r>=110)return'부길드장';
  if(r<115)return'장로';
  if(r>140&&g<110)return'길드장';
  return'';
}
const absLn=(a,b)=>Math.abs(Math.log(a/b));
const rawOf=r=>raw(r.val,r.unit);
const cleanName=t=>(t||'').replace(/[^가-힣A-Za-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const hangul=s=>(s.match(/[가-힣]/g)||[]).length;

async function readCard(cv,d,W){
  const p=readPower(cv,d);
  let name='';
  for(const s of [4,3]){const n=cleanName((await W.n.recognize(crop(cv,118,d+LAY.nameY-17,200,34,s))).data.text);if(hangul(n)>hangul(name)||(!name&&n))name=n}
  return{name,val:p?p.val:'',unit:p?p.unit:'B',role:readRole(cv,d),warn:!p||!p.ok,hasP:!!p};
}
function mergeRows(rows){
  const out=[];
  for(const r of rows){
    const t=r.hasP&&out.find(o=>o.hasP&&o.val===r.val&&o.unit===r.unit);
    if(!t){out.push({...r,names:[r.name]});continue}
    t.names.push(r.name);if(r.role&&r.role!=='멤버')t.role=r.role;
  }
  return out.map(o=>{
    const cnt={};o.names.filter(Boolean).forEach(n=>cnt[n]=(cnt[n]||0)+1);
    o.name=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||b.length-a.length)[0]||'';delete o.names;return o});
}
/* 이전 기록과 연결: 전투력 순서를 맞춰 보는 방식(아바타는 자주 바뀌므로 사용 안 함) */
const nameSim=(a,b)=>{if(!a||!b)return 0;const A=[...a],c=[...b].filter(ch=>A.includes(ch)).length;return c/Math.max(a.length,b.length)};
function matchKnown(rows){
  const nw=rows.map((r,i)=>({r,i})).filter(x=>x.r.hasP);
  const old=S.members.filter(m=>dates(m).length).sort((a,b)=>latest(b)-latest(a));
  const n=nw.length,m=old.length;if(!n||!m)return 0;
  const SK=0.6,INF=1e9,D=Array.from({length:n+1},()=>new Array(m+1).fill(INF)),B=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  D[0][0]=0;
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){
    if(i<n&&D[i][j]+SK<D[i+1][j]){D[i+1][j]=D[i][j]+SK;B[i+1][j]=1}
    if(j<m&&D[i][j]+SK<D[i][j+1]){D[i][j+1]=D[i][j]+SK;B[i][j+1]=2}
    if(i<n&&j<m){const l=absLn(rawOf(nw[i].r),latest(old[j]));
      if(l<0.5){const c=D[i][j]+4*l-(nameSim(nw[i].r.name,old[j].name)>=0.5?1.2:0);if(c<D[i+1][j+1]){D[i+1][j+1]=c;B[i+1][j+1]=3}}}
  }
  let i=n,j=m,cnt=0;
  while(i>0||j>0){const t=B[i][j];
    if(t===3){const r=nw[i-1].r,mm=old[j-1],l=absLn(rawOf(r),latest(mm));
      r.name=mm.name;r.matched=true;if(mm.role&&(!r.role||r.role==='멤버'))r.role=mm.role;
      const near=[nw[i-2],nw[i]].some(x=>x&&absLn(rawOf(x.r),rawOf(r))<Math.max(0.015,2*l));
      r.warn=r.warn||l>0.03||near;cnt++;i--;j--}
    else if(t===1)i--;else j--;}
  return cnt;
}
async function runOcr(){
  const files=[...$('files').files];if(!files.length)return alert('이미지를 선택하세요');
  const st=$('st');const W={};
  try{
    st.textContent='OCR 엔진 로딩 중…(처음에는 오래 걸립니다)';await loadTess();
    W.n=await Tesseract.createWorker('kor+eng');await W.n.setParameters({tessedit_pageseg_mode:'7'});
    let found=[],warnLayout=0;
    for(let i=0;i<files.length;i++){
      const cv=norm(await loadImg(files[i]));
      if(Math.abs(cv.ratio-LAY.ratio)>.05)warnLayout++;
      const ph=findPhase(cv),P=LAY.pitch;let c=0;
      for(let d=ph-P*3;d<LAY.bot;d+=P){
        if(d+LAY.nameY-17<LAY.top-2||d+LAY.roleY+14>LAY.bot+3)continue;
        st.textContent=`이미지 ${i+1}/${files.length} · ${++c}번째 카드 분석 중…`;
        found.push(await readCard(cv,d,W));
      }
    }
    const rows=mergeRows(found.filter(r=>r.hasP||r.name));
    rows.sort((a,b)=>(b.hasP?rawOf(b):0)-(a.hasP?rawOf(a):0));
    const known=matchKnown(rows);
    rows.forEach(r=>{if(!r.matched&&hangul(r.name)<2)r.warn=true;if(!r.role)r.warn=true});
    draft=[...draft,...rows.filter(r=>!draft.some(d=>d.name&&d.name===r.name))];
    st.textContent=`완료: ${rows.length}명 인식 (이전 기록과 자동 매칭 ${known}명). 노란 테두리 = 확인 필요.`+(warnLayout?' ⚠ 화면 비율이 달라 정확도가 낮을 수 있어요.':'');
    renderDraft();
  }catch(e){st.textContent='오류: '+e.message;console.error(e)}
  finally{for(const w of Object.values(W))w.terminate()}
}

function parseText(text){
  const rows=[];
  for(let line of text.split('\n')){
    line=line.trim();if(line.length<3)continue;
    let val=null,unit='M',rest=line,m=line.match(/(\d[\d,]*(?:\.\d+)?)\s*([BbMm])\b/);
    if(m){val=parseFloat(m[1].replace(/,/g,''));unit=m[2].toUpperCase();rest=line.replace(m[0],' ')}
    else if((m=line.match(/\d{1,3}(?:,\d{3}){2,}|\d{8,}/))){const n=parseFloat(m[0].replace(/,/g,''));if(n>=1e9){val=+(n/1e9).toFixed(3);unit='B'}else{val=+(n/1e6).toFixed(2)}rest=line.replace(m[0],' ')}
    if(val==null||isNaN(val))continue;
    let role='';for(const w of ROLE_WORDS)if(rest.includes(w)){role=w;rest=rest.replace(w,' ');break}
    rest=rest.replace(/Lv\.?\s*\d+/gi,' ').replace(/[^가-힣A-Za-z0-9_ ]/g,' ');
    const tk=rest.split(/\s+/).filter(t=>t.length>=2&&!/^\d+$/.test(t)).sort((a,b)=>b.length-a.length);
    rows.push({name:tk[0]||'',val:String(val),unit,role});
  }
  return rows;
}
function commit(){
  const date=$('dt').value||today();let u=0;draft.forEach(r=>{if(!r.name.trim()&&parseFloat(r.val)>0){while(find('미확인'+(++u)));r.name='미확인'+u}});const ok=draft.filter(r=>r.name.trim()&&parseFloat(r.val)>0);
  if(!ok.length)return alert('저장할 항목이 없습니다');
  const names=new Set();
  ok.forEach(r=>{const n=r.name.trim();names.add(n);let m=find(n);
    if(!m){m={name:n,role:'',guild:true,history:{},alt:[]};S.members.push(m)}
    if(r.role.trim())m.role=r.role.trim();m.guild=true;m.history[date]=raw(r.val,r.unit)});
  if($('demote').checked)S.members.forEach(m=>{if(m.guild&&!names.has(m.name))m.guild=false});
  save();draft=[];tab='rank';render();
}

function tableData(k){
  if(k==='rank')return[['순위','이름','직책','구분','전투력','전투력(M)','기록일']].concat(pool(S.filters.rank).map((m,i)=>[i+1,m.name,m.role,m.guild?'길드원':'대기',fmt(latest(m)),M(latest(m)),latestDate(m)]));
  if(k==='change')return[['전투력순위','변화율순위','이름','기준','이전(M)','현재(M)','변화율(%)','이전일','현재일']].concat(changes(S.filters.change).map(c=>[c.pr,c.rr||'',c.m.name,cLabel(),c.a?M(c.a):'',M(c.b),c.pct===null?'':+c.pct.toFixed(2),c.d0||'',c.d1]));
  if(k==='party'){const r=[['파티','이름','전투력','전투력(M)']];parties().forEach((g,i)=>g.forEach(m=>r.push([i+1,m.name,fmt(latest(m)),M(latest(m))])));return r}
  return[['순위','이름','전투력(M)'].concat(ALT.map(a=>a[0]))].concat(pool(false).map((m,i)=>[i+1,m.name,M(latest(m))].concat(ALT.map(a=>(m.alt||[]).includes(a[0])?'O':''))));
}
function copyTable(k){const t=tableData(k);if(t.length<2)return alert('복사할 명단이 없습니다');copy(t.map(r=>r.join('\t')).join('\n'),'표가 복사되었습니다. 엑셀에서 붙여넣기(Ctrl+V) 하세요.')}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-edit]');if(!t)return;
  if(t.dataset.cmode){S.cmode=t.dataset.cmode;save();render();return}
  if(t.dataset.tab){tab=t.dataset.tab;render();scrollTo(0,0);return}
  if(t.dataset.edit!==undefined){openSheet(t.dataset.edit);return}
  if(t.dataset.rm!==undefined){draft.splice(+t.dataset.rm,1);renderDraft();return}
  if(t.dataset.delh){const m=find($('sheet').dataset.orig);if(m&&confirm(t.dataset.delh+' 기록을 삭제할까요?')){delete m.history[t.dataset.delh];save();openSheet(m.name);render()}return}
  if(t.dataset.edh){const m=find($('sheet').dataset.orig),d=t.dataset.edh,v=m.history[d];$('s_unit').value=v>=1e9?'B':'M';$('s_val').value=+(v>=1e9?v/1e9:v/1e6).toFixed(3);$('s_date').value=d;$('s_val').focus();return}
  if(t.dataset.sheet==='merge'){const m=find($('sheet').dataset.orig),to=find($('s_merge').value);if(!to)return alert('합칠 멤버를 선택하세요');if(!confirm(m.name+' 의 기록을 '+to.name+' 에 합치고 '+m.name+' 은(는) 삭제합니다.'))return;Object.keys(m.history).forEach(d=>{if(!(d in to.history))to.history[d]=m.history[d]});S.members=S.members.filter(x=>x!==m);save();$('sheet').innerHTML='';render();return}
  if(t.dataset.sheet==='close'){$('sheet').innerHTML='';return}
  if(t.dataset.sheet==='save')return sheetSave();
  if(t.dataset.sheet==='del'){if(confirm('이 멤버와 모든 기록을 삭제할까요?')){S.members=S.members.filter(m=>m.name!==$('sheet').dataset.orig);save();$('sheet').innerHTML='';render()}return}
  switch(t.dataset.act){
    case'add':openSheet(null);break;
    case'ocr':runOcr();break;
    case'addrow':draft.push({name:'',val:'',unit:'B',role:''});renderDraft();break;
    case'commit':commit();break;
    case'csort':S.csort=(S.csort||'power')==='rate'?'power':'rate';save();render();break;
    case'img':saveImage(t.dataset.k);break;
    case'tbl':copyTable(t.dataset.k);break;
    case'copyparty':copy(parties().map((g,i)=>`[${i+1}파티] `+g.map(m=>m.name).join(', ')).join('\n'));break;
    case'copyalt':copy(ALT.map(a=>`${a[0]}:${a[1]} ${a[2]} - `+pool(false).filter(m=>(m.alt||[]).includes(a[0])).map(m=>m.name).join(', ')).join('\n'));break;
    case'resetalt':if(confirm('모든 조 편성을 해제할까요?')){S.members.forEach(m=>m.alt=[]);save();render()}break;
    case'export':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`guild-backup-${today()}.json`;a.click();break}
    case'import':$('imp').click();break;
    case'wipe':if(confirm('모든 데이터를 삭제합니다. 계속할까요?')){S={members:[],filters:{rank:false,change:false,party:false}};save();render()}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.filter){S.filters[t.dataset.filter]=t.checked;save();render()}
  else if(t.dataset.alt){const m=find(t.dataset.n);m.alt=m.alt||[];const k=t.dataset.alt;m.alt=t.checked?[...new Set([...m.alt,k])]:m.alt.filter(x=>x!==k);save();vAlt()}
  else if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.members)throw 0;S=d;S.filters=S.filters||{};save();render();alert('복원 완료')}catch(_){alert('올바른 백업 파일이 아닙니다')}};r.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.i!==undefined)draft[+t.dataset.i][t.dataset.f]=t.value});
render();
</script>
</body>
</html>
